<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc"><title id="title">Delivery routes for quick fixes and work items</title><desc id="desc">A localized low-risk request uses Quickfix, focused validation, and a recorded outcome. Broader or higher-risk work follows Story, Refine, Finalize, Tasks, Implement, and Review. Review either accepts the work or reopens only the tasks a finding names. Finalize returns a story with an open or new requirement gap to Refine, and a change request re-enters at Refine. Clarify resumes the blocked stage.</desc><style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#24324b}.lane{fill:#0c1323;stroke:#263653;stroke-dasharray:6 7}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.laneLabel{font:700 11px system-ui,sans-serif;letter-spacing:1.5px;fill:#7f91b1}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.quick{fill:#3a2b10;stroke:#ffc857}.start{fill:#123745;stroke:#39c9d9}.decision{fill:#1d3450;stroke:#69d8ff;stroke-width:2}.nodeTitle{font:700 14px system-ui,sans-serif;fill:#f8fafc}.nodeMeta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.flowQuick{fill:none;stroke:#ffc857;stroke-width:2.5;marker-end:url(#arrowGold)}.back{fill:none;stroke:#9c8cff;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrowV)}.backLabel{font:700 12px system-ui,sans-serif;fill:#9c8cff}.rework{fill:none;stroke:#ff8fa3;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrowR)}.reworkLabel{font:700 12px system-ui,sans-serif;fill:#ff8fa3}.label{font:700 12px system-ui,sans-serif;fill:#ffd978}.note{font:13px system-ui,sans-serif;fill:#aab8cf}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker><marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffc857"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c8cff"/></marker><marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff8fa3"/></marker></defs><rect class="bg" width="1440" height="590"/><rect fill="url(#grid)" width="1440" height="590" opacity=".9"/><rect class="surface" x="28" y="28" width="1384" height="534" rx="20"/><text x="64" y="67" class="eyebrow">DEVSPEC / DELIVERY</text><text x="64" y="103" class="title">Take the smallest safe route</text><text x="64" y="131" class="sub">Quickfix handles one localized, low-risk concern. Scope, risk, or durable design needs a traceable work item.</text><rect class="lane" x="64" y="156" width="1312" height="142" rx="14"/><text x="88" y="183" class="laneLabel">LOCAL / LOW-RISK CHANGE</text><rect class="lane" x="64" y="366" width="1312" height="130" rx="14"/><text x="88" y="393" class="laneLabel">PLANNED WORK ITEM</text><rect class="card start" x="90" y="264" width="155" height="58" rx="10"/><text x="110" y="288" class="nodeTitle">Request</text><text x="110" y="308" class="nodeMeta">one stated need</text><polygon class="decision" points="332,248 398,292 332,336 266,292"/><text x="332" y="287" text-anchor="middle" class="nodeTitle">Local +</text><text x="332" y="306" text-anchor="middle" class="nodeTitle">low risk?</text><rect class="card quick" x="500" y="205" width="150" height="58" rx="10"/><text x="520" y="229" class="nodeTitle">quickfix</text><text x="520" y="249" class="nodeMeta">targeted discovery</text><rect class="card quick" x="700" y="205" width="160" height="58" rx="10"/><text x="720" y="229" class="nodeTitle">focused validation</text><text x="720" y="249" class="nodeMeta">direct evidence</text><rect class="card quick" x="910" y="205" width="190" height="58" rx="10"/><text x="930" y="229" class="nodeTitle">QF record + outcome</text><text x="930" y="249" class="nodeMeta">resume state included</text><rect class="card" x="500" y="420" width="115" height="58" rx="10"/><text x="520" y="455" class="nodeTitle">story</text><rect class="card" x="645" y="420" width="130" height="58" rx="10"/><text x="665" y="455" class="nodeTitle">refine</text><rect class="card" x="805" y="420" width="115" height="58" rx="10"/><text x="825" y="455" class="nodeTitle">finalize</text><rect class="card" x="950" y="420" width="100" height="58" rx="10"/><text x="970" y="455" class="nodeTitle">tasks</text><rect class="card" x="1080" y="420" width="125" height="58" rx="10"/><text x="1100" y="455" class="nodeTitle">implement</text><rect class="card" x="1235" y="420" width="110" height="58" rx="10"/><text x="1255" y="455" class="nodeTitle">review</text><path class="flow" d="M245 293H266"/><path class="flowQuick" d="M398 270H450V234H500M650 234H700M860 234H910"/><path class="flow" d="M398 315H430V449H500M615 449H645M775 449H805M920 449H950M1050 449H1080M1205 449H1235"/><text x="425" y="257" class="label">YES</text><text x="440" y="340" class="label">NO / RISK</text><path class="back" d="M862 420V396H710V420"/><text x="700" y="400" text-anchor="end" class="backLabel">open gaps</text><path class="rework" d="M1290 420V396H1142V420"/><text x="1132" y="400" text-anchor="end" class="reworkLabel">rework</text><text x="720" y="358" class="note">any blocker: clarify, then resume the stage that recorded it</text><text x="64" y="530" class="foot">EVERY WORK ITEM IS REFINED AFTER STORY • FINALIZE RETURNS AN OPEN OR NEW REQUIREMENT GAP TO REFINE</text></svg>
