<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">devspec command flow overview</title>
  <desc id="desc">Compact overview of new repository foundation, existing repository foundation, work-item lifecycle, and supporting clarify and diagram commands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style><![CDATA[
      svg {
        background: #020617;
        color: #f8fafc;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }
      .frame {
        fill: #0f172a;
        stroke: #1e293b;
        stroke-width: 2;
      }
      .grid {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.45;
      }
      .title {
        fill: #f8fafc;
        font-size: 42px;
        font-weight: 700;
      }
      .subtitle {
        fill: #cbd5e1;
        font-size: 20px;
      }
      .lane-title {
        fill: #f8fafc;
        font-size: 24px;
        font-weight: 700;
      }
      .lane-note {
        fill: #94a3b8;
        font-size: 15px;
      }
      .node {
        stroke-width: 2;
        rx: 14;
      }
      .foundation {
        fill: #082f49;
        stroke: #38bdf8;
      }
      .extract {
        fill: #312e81;
        stroke: #818cf8;
      }
      .work {
        fill: #064e3b;
        stroke: #34d399;
      }
      .support {
        fill: #3b0764;
        stroke: #c084fc;
      }
      .gate {
        fill: #431407;
        stroke: #fb923c;
      }
      .label {
        fill: #f8fafc;
        font-size: 15px;
        font-weight: 700;
      }
      .small {
        fill: #cbd5e1;
        font-size: 14px;
      }
      .flow {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .muted-flow {
        fill: none;
        stroke: #94a3b8;
        stroke-width: 2.5;
        marker-end: url(#arrow-muted);
      }
      .optional-flow {
        fill: none;
        stroke: #c084fc;
        stroke-width: 2.5;
        stroke-dasharray: 9 8;
        marker-end: url(#arrow-muted);
      }
      .legend-text {
        fill: #cbd5e1;
        font-size: 15px;
      }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="#020617"/>
  <g opacity="0.55">
    <path class="grid" d="M 80 180 H 1520"/>
    <path class="grid" d="M 80 360 H 1520"/>
    <path class="grid" d="M 80 540 H 1520"/>
    <path class="grid" d="M 80 720 H 1520"/>
    <path class="grid" d="M 320 120 V 820"/>
    <path class="grid" d="M 640 120 V 820"/>
    <path class="grid" d="M 960 120 V 820"/>
    <path class="grid" d="M 1280 120 V 820"/>
  </g>

  <rect x="40" y="40" width="1520" height="820" rx="28" class="frame"/>
  <text x="80" y="100" class="title">devspec command flows</text>
  <text x="80" y="134" class="subtitle">Foundation commands prepare durable project context; work-item commands move one change from intake to review.</text>

  <g id="new-foundation">
    <text x="90" y="205" class="lane-title">New repository foundation</text>
    <text x="90" y="232" class="lane-note">Use when the repository has little or no implementation evidence.</text>

    <rect x="90" y="260" width="235" height="70" class="node foundation"/>
    <text x="112" y="303" class="label">/devspec.projectcontext</text>

    <path class="flow" d="M 325 295 H 382"/>
    <rect x="390" y="260" width="200" height="70" class="node foundation"/>
    <text x="424" y="303" class="label">/devspec.techstack</text>

    <path class="flow" d="M 590 295 H 647"/>
    <rect x="655" y="260" width="280" height="70" class="node foundation"/>
    <text x="677" y="303" class="label">/devspec.codebase-structure</text>

    <path class="flow" d="M 935 295 H 992"/>
    <rect x="1000" y="260" width="275" height="70" class="node foundation"/>
    <text x="1023" y="303" class="label">/devspec.coding-standards</text>

    <path class="flow" d="M 1275 295 H 1332"/>
    <rect x="1340" y="260" width="170" height="70" class="node foundation"/>
    <text x="1372" y="303" class="label">/devspec.rules</text>
  </g>

  <g id="existing-foundation">
    <text x="90" y="405" class="lane-title">Existing repository foundation</text>
    <text x="90" y="432" class="lane-note">Seed foundation artifacts from code, docs, manifests, configuration, and tests.</text>

    <rect x="90" y="460" width="175" height="70" class="node extract"/>
    <text x="118" y="503" class="label">/devspec.extract</text>

    <path class="flow" d="M 265 495 H 322"/>
    <rect x="330" y="460" width="235" height="70" class="node foundation"/>
    <text x="352" y="503" class="label">/devspec.projectcontext</text>

    <path class="flow" d="M 565 495 H 622"/>
    <rect x="630" y="460" width="200" height="70" class="node foundation"/>
    <text x="664" y="503" class="label">/devspec.techstack</text>

    <path class="flow" d="M 830 495 H 887"/>
    <rect x="895" y="460" width="280" height="70" class="node foundation"/>
    <text x="917" y="503" class="label">/devspec.codebase-structure</text>

    <path class="flow" d="M 1175 495 H 1232"/>
    <rect x="1240" y="460" width="270" height="70" class="node foundation"/>
    <text x="1262" y="490" class="small">/devspec.coding-standards</text>
    <text x="1262" y="515" class="small">/devspec.rules</text>
  </g>

  <g id="work-item">
    <text x="90" y="605" class="lane-title">Work-item lifecycle</text>
    <text x="90" y="632" class="lane-note">Move one feature, bug, security issue, task, or accepted change request from intake to review.</text>

    <rect x="90" y="660" width="170" height="70" class="node work"/>
    <text x="120" y="703" class="label">/devspec.story</text>

    <path class="flow" d="M 260 695 H 322"/>
    <rect x="330" y="660" width="185" height="70" class="node gate"/>
    <text x="362" y="693" class="label">/devspec.finalize</text>
    <text x="378" y="715" class="small">readiness gate</text>

    <path class="flow" d="M 515 695 H 577"/>
    <rect x="585" y="660" width="170" height="70" class="node work"/>
    <text x="624" y="703" class="label">/devspec.tasks</text>

    <path class="flow" d="M 755 695 H 817"/>
    <rect x="825" y="660" width="200" height="70" class="node work"/>
    <text x="856" y="703" class="label">/devspec.implement</text>

    <path class="flow" d="M 1025 695 H 1087"/>
    <rect x="1095" y="660" width="180" height="70" class="node work"/>
    <text x="1134" y="703" class="label">/devspec.review</text>

    <rect x="330" y="760" width="185" height="54" class="node support"/>
    <text x="362" y="794" class="label">/devspec.clarify</text>
    <text x="532" y="792" class="legend-text">only for recorded blockers</text>
    <path class="optional-flow" d="M 422 660 V 620 C 422 590 175 590 175 660"/>
    <path class="optional-flow" d="M 422 730 V 752"/>
  </g>

  <g id="diagram-support">
    <rect x="1325" y="635" width="185" height="92" class="node support"/>
    <text x="1355" y="676" class="label">/devspec.diagram</text>
    <text x="1354" y="700" class="small">architecture, state,</text>
    <text x="1354" y="720" class="small">sequence, workflow</text>
    <path class="optional-flow" d="M 1417 635 V 545"/>
    <path class="optional-flow" d="M 1325 681 H 1278"/>
  </g>

  <g id="legend">
    <rect x="90" y="820" width="16" height="16" class="foundation"/>
    <text x="116" y="834" class="legend-text">foundation</text>
    <rect x="235" y="820" width="16" height="16" class="work"/>
    <text x="261" y="834" class="legend-text">work item</text>
    <rect x="365" y="820" width="16" height="16" class="support"/>
    <text x="391" y="834" class="legend-text">supporting command</text>
    <line x1="570" y1="828" x2="635" y2="828" class="optional-flow"/>
    <text x="648" y="834" class="legend-text">conditional path</text>
  </g>
</svg>
