<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">CLI installation and maintenance flow for devspec</title><desc id="desc">A developer installs the CLI, checks its version, initializes the selected profile, runs Doctor, commits canonical Git-tracked artifacts, and repeats initialization and Doctor after a safe CLI lifecycle change. Manual copying follows its separate no-installer flow.</desc><style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#24324b}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.start{fill:#123745;stroke:#39c9d9}.safe{fill:#17372d;stroke:#64d49a}.nodeTitle{font:700 15px system-ui,sans-serif;fill:#f8fafc}.nodeMeta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#9c8cff;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowV)}.note{font:13px system-ui,sans-serif;fill:#c1cae0}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c8cff"/></marker></defs><rect class="bg" width="1440" height="440"/><rect fill="url(#grid)" width="1440" height="440" opacity=".9"/><rect class="surface" x="28" y="28" width="1384" height="384" rx="20"/><text x="64" y="67" class="eyebrow">DEVSPEC / LIFECYCLE</text><text x="64" y="103" class="title">CLI install, verify, and maintain</text><text x="64" y="131" class="sub">CLI route only. Artifacts are project-owned and Git-tracked; manual copy uses its separate flow.</text><rect class="card start" x="95" y="220" width="180" height="62" rx="10"/><text x="115" y="246" class="nodeTitle">Install</text><text x="115" y="266" class="nodeMeta">uvx, pipx, WinGet, or brew</text><rect class="card" x="335" y="220" width="150" height="62" rx="10"/><text x="355" y="246" class="nodeTitle">Version check</text><text x="355" y="266" class="nodeMeta">--version</text><rect class="card" x="545" y="220" width="220" height="62" rx="10"/><text x="565" y="246" class="nodeTitle">Initialize profile</text><text x="565" y="266" class="nodeMeta">init + target + repository state</text><rect class="card" x="825" y="220" width="150" height="62" rx="10"/><text x="845" y="246" class="nodeTitle">Doctor</text><text x="845" y="266" class="nodeMeta">read-only verification</text><rect class="card safe" x="1035" y="220" width="260" height="62" rx="10"/><text x="1055" y="246" class="nodeTitle">Commit canonical artifacts</text><text x="1055" y="266" class="nodeMeta">then begin the selected workflow</text><path class="flow" d="M275 251H335M485 251H545M765 251H825M975 251H1035"/><path class="loop" d="M900 220V166H655V220"/><text x="665" y="153" class="note">upgrade, add a profile, or sync → init → doctor</text><text x="64" y="366" class="foot">CLI ROUTE: INIT REFUSES MODIFIED MANAGED FILES • DOCTOR CHECKS REQUIRED PATHS AND STRUCTURE WITHOUT WRITING</text></svg>
