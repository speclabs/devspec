<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc"><title id="title">Diagram command route for devspec</title><desc id="desc">A queued candidate or subject is duplicate-checked, matched to a diagram type and family template, generated as SVG, validated, then indexed in the queue and overview. A diagram invoked by another command returns to that caller; one requested directly ends terminal. Missing evidence records a blocker and routes to devspec.clarify, which resumes the queued subject.</desc><style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#24324b}.lane{fill:#0c1323;stroke:#263653;stroke-dasharray:6 7}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.laneTitle{font:700 11px system-ui,sans-serif;letter-spacing:1.6px;fill:#64d49a}.laneTitleAlt{font:700 11px system-ui,sans-serif;letter-spacing:1.6px;fill:#ff8fa8}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.start{fill:#123745;stroke:#39c9d9}.safe{fill:#17372d;stroke:#64d49a}.warn{fill:#3a1622;stroke:#ff8fa8}.nodeTitle{font:700 15px system-ui,sans-serif;fill:#f8fafc}.nodeMeta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.exception{fill:none;stroke:#ff8fa8;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowX)}.loop{fill:none;stroke:#9c8cff;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowV)}.label{font:700 11px system-ui,sans-serif;fill:#ffb3c4}.note{font:13px system-ui,sans-serif;fill:#c1cae0}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#69d8ff"/></marker><marker id="arrowX" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#ff8fa8"/></marker><marker id="arrowV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3z" fill="#9c8cff"/></marker></defs><rect class="bg" width="1440" height="470"/><rect fill="url(#grid)" width="1440" height="470"/><rect class="surface" x="22" y="22" width="1396" height="426" rx="18"/><text x="52" y="57" class="eyebrow">DEVSPEC / DIAGRAM</text><text x="52" y="88" class="title">Generate one diagram, once</text><text x="52" y="111" class="sub">A queued candidate becomes one validated, indexed diagram. Anything unproven becomes a clarify blocker instead.</text><rect class="lane" x="52" y="138" width="1336" height="124" rx="14"/><text x="76" y="162" class="laneTitle">GENERATE</text><rect class="lane" x="52" y="310" width="1336" height="96" rx="14"/><text x="76" y="334" class="laneTitleAlt">BLOCKED</text><path class="flow" d="M232 205H272M438 205H478M624 205H664M820 205H860M1006 205H1046M1206 205H1246"/><path class="exception" d="M551 234V348"/><text x="563" y="272" class="label">NO EVIDENCE</text><path class="flow" d="M658 372H760"/><path class="loop" d="M845 396V420H159V234"/><text x="200" y="411" class="note">clarify, then resume the queued subject</text><rect class="card start" x="86" y="176" width="146" height="58" rx="10"/><text x="159" y="200" class="nodeTitle" text-anchor="middle">Queue row</text><text x="159" y="220" class="nodeMeta" text-anchor="middle">DIA-### or subject</text><rect class="card" x="272" y="176" width="166" height="58" rx="10"/><text x="355" y="200" class="nodeTitle" text-anchor="middle">Duplicate check</text><text x="355" y="220" class="nodeMeta" text-anchor="middle">compare subjects</text><rect class="card" x="478" y="176" width="146" height="58" rx="10"/><text x="551" y="200" class="nodeTitle" text-anchor="middle">Select type</text><text x="551" y="220" class="nodeMeta" text-anchor="middle">family template</text><rect class="card" x="664" y="176" width="156" height="58" rx="10"/><text x="742" y="200" class="nodeTitle" text-anchor="middle">Generate SVG</text><text x="742" y="220" class="nodeMeta" text-anchor="middle">motion optional</text><rect class="card" x="860" y="176" width="146" height="58" rx="10"/><text x="933" y="200" class="nodeTitle" text-anchor="middle">Validate XML</text><text x="933" y="220" class="nodeMeta" text-anchor="middle">standalone check</text><rect class="card safe" x="1046" y="176" width="160" height="58" rx="10"/><text x="1126" y="200" class="nodeTitle" text-anchor="middle">Index output</text><text x="1126" y="220" class="nodeMeta" text-anchor="middle">queue + overview</text><rect class="card start" x="1246" y="180" width="130" height="50" rx="25"/><text x="1311" y="200" class="nodeTitle" text-anchor="middle">Caller</text><text x="1311" y="219" class="nodeMeta" text-anchor="middle">or none, standalone</text><rect class="card warn" x="478" y="348" width="180" height="48" rx="10"/><text x="568" y="377" class="nodeTitle" text-anchor="middle">Evidence blocker</text><rect class="card" x="760" y="348" width="170" height="48" rx="10"/><text x="845" y="377" class="nodeTitle" text-anchor="middle">devspec.clarify</text><text x="52" y="436" class="foot">ONE DIAGRAM PER RUN • QUEUE STATE IS DURABLE • CALLER LIFECYCLE STAGE IS NEVER CHANGED</text></svg>
