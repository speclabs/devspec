<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">Existing repository foundation flow</title>
  <desc id="desc">Existing repository foundation command sequence starting with extraction, then project context, tech stack, codebase structure, coding standards, and rules.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style><![CDATA[
      svg { background: #020617; font-family: "JetBrains Mono", "Cascadia Code", monospace; }
      .frame { fill: #0f172a; stroke: #1e293b; stroke-width: 2; }
      .grid { stroke: #1e293b; stroke-width: 1; opacity: 0.42; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #cbd5e1; font-size: 16px; }
      .node { fill: #082f49; stroke: #38bdf8; stroke-width: 2; rx: 12; }
      .extract { fill: #312e81; stroke: #818cf8; }
      .label { fill: #f8fafc; font-size: 13px; font-weight: 700; }
      .note { fill: #94a3b8; font-size: 12px; }
      .flow { fill: none; stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrow); }
    ]]></style>
  </defs>
  <rect width="1500" height="420" fill="#020617"/>
  <g>
    <path class="grid" d="M 70 130 H 1430"/>
    <path class="grid" d="M 70 250 H 1430"/>
    <path class="grid" d="M 300 80 V 350"/>
    <path class="grid" d="M 600 80 V 350"/>
    <path class="grid" d="M 900 80 V 350"/>
    <path class="grid" d="M 1200 80 V 350"/>
  </g>
  <rect x="40" y="40" width="1420" height="340" rx="24" class="frame"/>
  <text x="75" y="95" class="title">Existing repository foundation</text>
  <text x="75" y="124" class="subtitle">Extract repository evidence first, then confirm and refine the durable foundation artifacts.</text>

  <rect x="75" y="190" width="160" height="76" class="node extract"/>
  <text x="94" y="233" class="label">/devspec.extract</text>
  <text x="98" y="253" class="note">seed evidence</text>

  <path class="flow" d="M 235 228 H 262"/>
  <rect x="270" y="190" width="210" height="76" class="node"/>
  <text x="285" y="233" class="label">/devspec.projectcontext</text>
  <text x="322" y="253" class="note">product context</text>

  <path class="flow" d="M 480 228 H 507"/>
  <rect x="515" y="190" width="190" height="76" class="node"/>
  <text x="541" y="233" class="label">/devspec.techstack</text>
  <text x="562" y="253" class="note">runtime/tools</text>

  <path class="flow" d="M 705 228 H 732"/>
  <rect x="740" y="190" width="250" height="76" class="node"/>
  <text x="752" y="233" class="label">/devspec.codebase-structure</text>
  <text x="811" y="253" class="note">boundaries</text>

  <path class="flow" d="M 990 228 H 1017"/>
  <rect x="1025" y="190" width="250" height="76" class="node"/>
  <text x="1038" y="233" class="label">/devspec.coding-standards</text>
  <text x="1094" y="253" class="note">standards</text>

  <path class="flow" d="M 1275 228 H 1302"/>
  <rect x="1310" y="190" width="135" height="76" class="node"/>
  <text x="1320" y="233" class="label">/devspec.rules</text>
  <text x="1336" y="253" class="note">gates</text>
</svg>
