<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">Foundation routes for new and existing repositories</title><desc id="desc">New repositories begin with project context. Existing repositories use Extract to create the complete evidence-backed baseline.</desc><style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#24324b}.lane{fill:#0c1323;stroke:#263653;stroke-dasharray:6 7}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.laneLabel{font:700 11px system-ui,sans-serif;letter-spacing:1.5px;fill:#7f91b1}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.start{fill:#123745;stroke:#39c9d9}.extract{fill:#252044;stroke:#9c8cff}.nodeTitle{font:700 15px system-ui,sans-serif;fill:#f8fafc}.nodeMeta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.flowMuted{fill:none;stroke:#9c8cff;stroke-width:2.5;marker-end:url(#arrowV)}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c8cff"/></marker></defs><rect class="bg" width="1440" height="520"/><rect fill="url(#grid)" width="1440" height="520" opacity=".9"/><rect class="surface" x="28" y="28" width="1384" height="464" rx="20"/><text x="64" y="67" class="eyebrow">DEVSPEC / FOUNDATION</text><text x="64" y="103" class="title">Choose the correct repository route</text><text x="64" y="131" class="sub">New projects are documented intentionally. Existing systems are documented end-to-end from observed evidence.</text><rect class="lane" x="64" y="154" width="1312" height="126" rx="14"/><text x="88" y="181" class="laneLabel">NEW REPOSITORY</text><rect class="lane" x="64" y="314" width="1312" height="126" rx="14"/><text x="88" y="341" class="laneLabel">EXISTING REPOSITORY</text><rect class="card start" x="110" y="196" width="180" height="58" rx="10"/><text x="130" y="220" class="nodeTitle">New repository</text><text x="130" y="240" class="nodeMeta">no source to inspect</text><rect class="card start" x="110" y="356" width="180" height="58" rx="10"/><text x="130" y="380" class="nodeTitle">Existing repository</text><text x="130" y="400" class="nodeMeta">source already present</text><rect class="card extract" x="335" y="356" width="150" height="58" rx="10"/><text x="355" y="380" class="nodeTitle">extract</text><text x="355" y="400" class="nodeMeta">complete baseline</text><rect class="card" x="535" y="245" width="165" height="58" rx="10"/><text x="553" y="269" class="nodeTitle">projectcontext</text><text x="553" y="289" class="nodeMeta">purpose + boundaries</text><rect class="card" x="718" y="245" width="125" height="58" rx="10"/><text x="736" y="269" class="nodeTitle">techstack</text><text x="736" y="289" class="nodeMeta">observed tooling</text><rect class="card" x="861" y="245" width="185" height="58" rx="10"/><text x="879" y="269" class="nodeTitle">codebase-structure</text><text x="879" y="289" class="nodeMeta">roots + boundaries</text><rect class="card" x="1064" y="245" width="172" height="58" rx="10"/><text x="1082" y="269" class="nodeTitle">coding-standards</text><text x="1082" y="289" class="nodeMeta">conventions</text><rect class="card" x="1254" y="245" width="105" height="58" rx="10"/><text x="1272" y="269" class="nodeTitle">rules</text><text x="1272" y="289" class="nodeMeta">constraints</text><path class="flow" d="M290 225H505V274H535"/><path class="flowMuted" d="M290 385H335"/><path class="flow" d="M700 274H718M843 274H861M1046 274H1064M1236 274H1254"/><text x="64" y="468" class="foot">NEW: AUTHOR FOUNDATION COMMANDS • EXISTING: EXTRACT CREATES THE COMPLETE BASELINE • BOTH ROUTES END AT DEVSPEC.STORY</text></svg>
