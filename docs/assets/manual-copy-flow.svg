<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Manual copy flow for devspec</title>
  <desc id="desc">A developer checks out the latest main branch, chooses one agent profile, copies the canonical artifacts into a target repository, resets the project records that the checkout carries, sets the target repository state, then verifies and commits. Updates repeat the comparison and copy steps without requiring the CLI.</desc>
  <style>.bg{fill:#070b18}.surface{fill:#101827;stroke:#263653}.card{fill:#16223a;stroke:#35517c;stroke-width:1.5}.start{fill:#123745;stroke:#39c9d9}.reset{fill:#3a2b10;stroke:#ffc857}.safe{fill:#17372d;stroke:#64d49a}.eyebrow{font:700 12px system-ui,sans-serif;letter-spacing:2px;fill:#69d8ff}.title{font:700 30px system-ui,sans-serif;fill:#f8fafc}.sub{font:15px system-ui,sans-serif;fill:#aab8cf}.node{font:700 15px system-ui,sans-serif;fill:#f8fafc}.meta{font:12px system-ui,sans-serif;fill:#aab8cf}.flow{fill:none;stroke:#69d8ff;stroke-width:2.5;marker-end:url(#arrow)}.loop{fill:none;stroke:#9c8cff;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowV)}.note{font:13px system-ui,sans-serif;fill:#c1cae0}.foot{font:600 11px system-ui,sans-serif;letter-spacing:1px;fill:#6f86a8}</style>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#14213a"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69d8ff"/></marker><marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9c8cff"/></marker></defs>
  <rect class="bg" width="1440" height="440"/><rect fill="url(#grid)" width="1440" height="440" opacity=".9"/><rect class="surface" x="28" y="28" width="1384" height="384" rx="20"/>
  <text x="64" y="67" class="eyebrow">DEVSPEC / MANUAL COPY</text><text x="64" y="103" class="title">Copy the latest main profile without an installer</text><text x="64" y="131" class="sub">Main-branch files are canonical. Python and the CLI are optional, not required.</text>
  <rect class="card start" x="56" y="220" width="205" height="62" rx="10"/><text x="72" y="246" class="node">Check out main</text><text x="72" y="266" class="meta">latest canonical files</text>
  <rect class="card" x="279" y="220" width="205" height="62" rx="10"/><text x="295" y="246" class="node">Choose profile</text><text x="295" y="266" class="meta">one agent host</text>
  <rect class="card" x="502" y="220" width="205" height="62" rx="10"/><text x="518" y="246" class="node">Copy required files</text><text x="518" y="266" class="meta">devspec + wrapper</text>
  <rect class="card reset" x="725" y="220" width="205" height="62" rx="10"/><text x="741" y="246" class="node">Reset project data</text><text x="741" y="266" class="meta">queue, overview, QF</text>
  <rect class="card" x="948" y="220" width="205" height="62" rx="10"/><text x="964" y="246" class="node">Set repository state</text><text x="964" y="266" class="meta">new or existing</text>
  <rect class="card safe" x="1171" y="220" width="205" height="62" rx="10"/><text x="1187" y="246" class="node">Verify and commit</text><text x="1187" y="266" class="meta">manifest + reset table</text>
  <path class="flow" d="M261 251H279M484 251H502M707 251H725M930 251H948M1153 251H1171"/><path class="loop" d="M1273 220V166H604V220"/><text x="620" y="153" class="note">latest main → compare, copy approved changes, reset project data, commit</text><text x="64" y="366" class="foot">NO PYTHON • NO CLI • NO PACKAGE MANAGER • PRESERVE LOCAL CUSTOMIZATIONS</text>
</svg>
