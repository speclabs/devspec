<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Work-item lifecycle flow</title>
  <desc id="desc">Work-item lifecycle command sequence from story to review, with clarify as a conditional blocker-resolution branch, an append-only post-finalization change-request loop, and diagram as an optional supporting command.</desc>
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style><![CDATA[
      svg { background: #020617; font-family: "JetBrains Mono", "Cascadia Code", monospace; }
      .frame { fill: #0f172a; stroke: #1e293b; stroke-width: 2; }
      .grid { stroke: #1e293b; stroke-width: 1; opacity: 0.42; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #cbd5e1; font-size: 16px; }
      .node { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 12; }
      .gate { fill: #431407; stroke: #fb923c; }
      .support { fill: #3b0764; stroke: #c084fc; }
      .change { fill: #4c1d12; stroke: #fb923c; }
      .label { fill: #f8fafc; font-size: 13px; font-weight: 700; }
      .note { fill: #94a3b8; font-size: 12px; }
      .flow { fill: none; stroke: #34d399; stroke-width: 3; marker-end: url(#arrow-green); }
      .optional { fill: none; stroke: #c084fc; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow-muted); }
    ]]></style>
  </defs>
  <rect width="1500" height="500" fill="#020617"/>
  <g>
    <path class="grid" d="M 70 150 H 1430"/>
    <path class="grid" d="M 70 290 H 1430"/>
    <path class="grid" d="M 300 90 V 430"/>
    <path class="grid" d="M 600 90 V 430"/>
    <path class="grid" d="M 900 90 V 430"/>
    <path class="grid" d="M 1200 90 V 430"/>
  </g>
  <rect x="40" y="40" width="1420" height="420" rx="24" class="frame"/>
  <text x="75" y="95" class="title">Work-item lifecycle</text>
  <text x="75" y="124" class="subtitle">Move one scoped change through intake, readiness, task planning, implementation, and review.</text>

  <rect x="75" y="210" width="170" height="76" class="node"/>
  <text x="105" y="253" class="label">/devspec.story</text>
  <text x="105" y="273" class="note">intake</text>

  <path class="flow" d="M 245 248 H 300"/>
  <rect x="310" y="210" width="190" height="76" class="node gate"/>
  <text x="342" y="244" class="label">/devspec.finalize</text>
  <text x="355" y="264" class="note">readiness gate</text>

  <path class="flow" d="M 500 248 H 555"/>
  <rect x="565" y="210" width="170" height="76" class="node"/>
  <text x="603" y="253" class="label">/devspec.tasks</text>
  <text x="608" y="273" class="note">task plan</text>

  <path class="flow" d="M 735 248 H 790"/>
  <rect x="800" y="210" width="205" height="76" class="node"/>
  <text x="830" y="253" class="label">/devspec.implement</text>
  <text x="853" y="273" class="note">execute</text>

  <path class="flow" d="M 1005 248 H 1060"/>
  <rect x="1070" y="210" width="185" height="76" class="node"/>
  <text x="1111" y="253" class="label">/devspec.review</text>
  <text x="1100" y="273" class="note">verify outcome</text>

  <rect x="310" y="342" width="190" height="62" class="node support"/>
  <text x="342" y="378" class="label">/devspec.clarify</text>
  <text x="528" y="367" class="note">conditional branch for recorded blockers</text>
  <path class="optional" d="M 405 210 V 176 C 405 162 160 162 160 210"/>
  <path class="optional" d="M 405 286 V 334"/>

  <rect x="1285" y="210" width="150" height="76" class="node support"/>
  <rect x="780" y="342" width="235" height="62" class="node change"/>
  <text x="795" y="378" class="label">/devspec.changerequest</text>
  <text x="830" y="397" class="note">missed related requirement</text>
  <path class="optional" d="M 1162 286 V 373 H 1015"/>
  <path class="optional" d="M 780 373 H 620 V 310 H 500"/>
  <text x="1027" y="338" class="note">post-finalization only</text>

  <text x="1309" y="253" class="label">/devspec.diagram</text>
  <text x="1308" y="273" class="note">optional visual</text>
  <path class="optional" d="M 1285 248 H 1262"/>
</svg>
