<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">devspec detailed command flow</title>
  <desc id="desc">Detailed flow showing command order, durable artifacts, gates, handoffs, and supporting diagram and clarification paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style><![CDATA[
      svg {
        background: #020617;
        color: #f8fafc;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }
      .frame {
        fill: #0f172a;
        stroke: #1e293b;
        stroke-width: 2;
      }
      .band {
        fill: #111827;
        stroke: #334155;
        stroke-width: 2;
        rx: 22;
      }
      .band-alt {
        fill: #0b1120;
        stroke: #334155;
        stroke-width: 2;
        rx: 22;
      }
      .grid {
        stroke: #1e293b;
        stroke-width: 1;
        opacity: 0.4;
      }
      .title {
        fill: #f8fafc;
        font-size: 46px;
        font-weight: 700;
      }
      .subtitle {
        fill: #cbd5e1;
        font-size: 20px;
      }
      .section {
        fill: #f8fafc;
        font-size: 25px;
        font-weight: 700;
      }
      .note {
        fill: #94a3b8;
        font-size: 15px;
      }
      .node {
        stroke-width: 2;
        rx: 13;
      }
      .foundation {
        fill: #082f49;
        stroke: #38bdf8;
      }
      .extract {
        fill: #312e81;
        stroke: #818cf8;
      }
      .work {
        fill: #064e3b;
        stroke: #34d399;
      }
      .gate {
        fill: #431407;
        stroke: #fb923c;
      }
      .support {
        fill: #3b0764;
        stroke: #c084fc;
      }
      .artifact {
        fill: #172554;
        stroke: #60a5fa;
      }
      .label {
        fill: #f8fafc;
        font-size: 15px;
        font-weight: 700;
      }
      .small {
        fill: #cbd5e1;
        font-size: 13px;
      }
      .tiny {
        fill: #94a3b8;
        font-size: 12px;
      }
      .flow {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .work-flow {
        fill: none;
        stroke: #34d399;
        stroke-width: 3;
        marker-end: url(#arrow-green);
      }
      .optional-flow {
        fill: none;
        stroke: #c084fc;
        stroke-width: 2.5;
        stroke-dasharray: 9 8;
        marker-end: url(#arrow-muted);
      }
      .artifact-flow {
        fill: none;
        stroke: #60a5fa;
        stroke-width: 2;
        stroke-dasharray: 5 6;
        marker-end: url(#arrow-muted);
      }
    ]]></style>
  </defs>

  <rect width="1800" height="1100" fill="#020617"/>
  <g opacity="0.55">
    <path class="grid" d="M 100 180 H 1700"/>
    <path class="grid" d="M 100 360 H 1700"/>
    <path class="grid" d="M 100 540 H 1700"/>
    <path class="grid" d="M 100 720 H 1700"/>
    <path class="grid" d="M 100 900 H 1700"/>
    <path class="grid" d="M 360 120 V 1010"/>
    <path class="grid" d="M 720 120 V 1010"/>
    <path class="grid" d="M 1080 120 V 1010"/>
    <path class="grid" d="M 1440 120 V 1010"/>
  </g>

  <rect x="45" y="45" width="1710" height="1010" rx="30" class="frame"/>
  <text x="90" y="110" class="title">devspec command flow details</text>
  <text x="90" y="145" class="subtitle">Commands write durable Git-tracked artifacts first, then hand off to the next registered workflow command.</text>

  <g id="foundation">
    <rect x="85" y="190" width="1630" height="275" class="band"/>
    <text x="115" y="232" class="section">Foundation setup</text>
    <text x="115" y="258" class="note">New repositories start at project context. Existing repositories run extraction first to seed evidence-backed foundation artifacts.</text>

    <rect x="115" y="300" width="190" height="64" class="node extract"/>
    <text x="148" y="339" class="label">/devspec.extract</text>
    <text x="126" y="386" class="tiny">existing repos only</text>

    <path class="flow" d="M 305 332 H 362"/>
    <rect x="370" y="300" width="235" height="64" class="node foundation"/>
    <text x="391" y="339" class="label">/devspec.projectcontext</text>

    <path class="flow" d="M 605 332 H 662"/>
    <rect x="670" y="300" width="205" height="64" class="node foundation"/>
    <text x="704" y="339" class="label">/devspec.techstack</text>

    <path class="flow" d="M 875 332 H 932"/>
    <rect x="940" y="300" width="280" height="64" class="node foundation"/>
    <text x="963" y="339" class="label">/devspec.codebase-structure</text>

    <path class="flow" d="M 1220 332 H 1277"/>
    <rect x="1285" y="300" width="280" height="64" class="node foundation"/>
    <text x="1308" y="339" class="label">/devspec.coding-standards</text>

    <path class="flow" d="M 1425 364 V 398 H 362 V 402"/>
    <rect x="370" y="390" width="170" height="56" class="node foundation"/>
    <text x="402" y="424" class="label">/devspec.rules</text>

    <rect x="610" y="390" width="350" height="56" class="node artifact"/>
    <text x="632" y="413" class="small">Foundation artifacts</text>
    <text x="632" y="433" class="tiny">project-context, tech-stack, structure, standards, rules</text>
    <path class="artifact-flow" d="M 455 390 V 372"/>
    <path class="artifact-flow" d="M 785 390 V 372"/>

    <rect x="1030" y="390" width="285" height="56" class="node artifact"/>
    <text x="1052" y="413" class="small">Architecture context</text>
    <text x="1052" y="433" class="tiny">overview and queued diagram candidates</text>
    <path class="artifact-flow" d="M 210 364 C 210 430 1000 430 1030 418"/>
  </g>

  <g id="work-item">
    <rect x="85" y="505" width="1630" height="360" class="band-alt"/>
    <text x="115" y="547" class="section">Work-item lifecycle</text>
    <text x="115" y="573" class="note">A feature, bug, task, security issue, or accepted change request moves through readiness, tasks, implementation, and review.</text>

    <rect x="115" y="625" width="175" height="66" class="node work"/>
    <text x="145" y="665" class="label">/devspec.story</text>
    <text x="126" y="713" class="tiny">intake and scope</text>

    <path class="work-flow" d="M 290 658 H 357"/>
    <rect x="365" y="625" width="190" height="66" class="node gate"/>
    <text x="397" y="655" class="label">/devspec.finalize</text>
    <text x="405" y="676" class="small">ready gate</text>

    <path class="work-flow" d="M 555 658 H 622"/>
    <rect x="630" y="625" width="170" height="66" class="node work"/>
    <text x="668" y="665" class="label">/devspec.tasks</text>

    <path class="work-flow" d="M 800 658 H 867"/>
    <rect x="875" y="625" width="205" height="66" class="node work"/>
    <text x="905" y="665" class="label">/devspec.implement</text>

    <path class="work-flow" d="M 1080 658 H 1147"/>
    <rect x="1155" y="625" width="185" height="66" class="node work"/>
    <text x="1196" y="665" class="label">/devspec.review</text>

    <path class="work-flow" d="M 1340 658 H 1407"/>
    <rect x="1415" y="625" width="250" height="66" class="node artifact"/>
    <text x="1440" y="653" class="small">Close or return</text>
    <text x="1440" y="674" class="tiny">review outcome determines next action</text>

    <rect x="365" y="745" width="190" height="62" class="node support"/>
    <text x="397" y="782" class="label">/devspec.clarify</text>
    <text x="580" y="770" class="small">Only when story or finalize records a blocking question.</text>
    <path class="optional-flow" d="M 460 625 V 595 C 460 585 202 585 202 625"/>
    <path class="optional-flow" d="M 460 691 V 737"/>

    <rect x="630" y="745" width="450" height="62" class="node artifact"/>
    <text x="652" y="770" class="small">Work-item artifacts</text>
    <text x="652" y="790" class="tiny">meta, story, decisions, finalize, tasks, implement, review</text>
    <path class="artifact-flow" d="M 715 691 V 737"/>
    <path class="artifact-flow" d="M 977 691 V 737"/>
    <path class="artifact-flow" d="M 1247 691 C 1247 755 1100 770 1080 776"/>

    <rect x="1155" y="745" width="330" height="62" class="node gate"/>
    <text x="1177" y="770" class="small">Post-baseline changes</text>
    <text x="1177" y="790" class="tiny">route related new scope through /devspec.story</text>
    <path class="optional-flow" d="M 1320 745 C 1320 715 202 715 202 691"/>
  </g>

  <g id="supporting">
    <rect x="85" y="905" width="1630" height="115" class="band"/>
    <text x="115" y="947" class="section">Supporting diagram flow</text>
    <text x="115" y="975" class="note">Run /devspec.diagram whenever a visual clarifies architecture, workflow, state, sequence, domain behavior, or a work-item-specific flow.</text>

    <rect x="1025" y="930" width="220" height="64" class="node support"/>
    <text x="1057" y="969" class="label">/devspec.diagram</text>

    <path class="optional-flow" d="M 1025 962 H 755"/>
    <rect x="430" y="930" width="325" height="64" class="node artifact"/>
    <text x="452" y="954" class="small">SVG by default</text>
    <text x="452" y="974" class="tiny">optional mermaid or html with format=</text>

    <path class="optional-flow" d="M 1245 962 H 1357"/>
    <rect x="1365" y="930" width="290" height="64" class="node artifact"/>
    <text x="1387" y="954" class="small">Diagram artifacts</text>
    <text x="1387" y="974" class="tiny">architecture images or work-item images</text>
  </g>
</svg>
