[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devspec"
dynamic = ["version"]
description = "Compact, resumable spec-driven workflow templates for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "devspec contributors"}]
keywords = ["ai", "agents", "developer-tools", "workflow", "spec-driven-development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/speclabs/devspec"
Documentation = "https://github.com/speclabs/devspec#readme"
Issues = "https://github.com/speclabs/devspec/issues"

[project.scripts]
devspec = "devspec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "devspec.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
