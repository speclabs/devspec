<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">[PROCESS_NAME] - Process Flow</title>
  <desc id="desc">[PROCESS_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.65; opacity: 0.7; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.25; filter: url(#soft-shadow); }
      .header-line { stroke: #1e293b; stroke-width: 1; opacity: 0.95; }
      .status-dot { fill: #22d3ee; filter: url(#cyan-glow); }
      .eyebrow { fill: #67e8f9; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
      .title { fill: #f8fafc; font-size: 31px; font-weight: 900; }
      .subtitle { fill: #94a3b8; font-size: 13px; font-weight: 600; }
      .footer { fill: #64748b; font-size: 10px; font-weight: 600; }

      .pre-box { fill: rgba(30, 41, 59, 0.34); stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 8 6; }
      .pre-title { fill: #cbd5e1; font-size: 11px; font-weight: 900; letter-spacing: 1.2px; }
      .chip { fill: rgba(15, 23, 42, 0.92); stroke: #334155; stroke-width: 1; }
      .chip-text { fill: #cbd5e1; font-size: 10px; font-weight: 700; }

      .lane { fill: rgba(15, 23, 42, 0.18); stroke: #1e293b; stroke-width: 1; stroke-dasharray: 6 8; }
      .lane-title { fill: #64748b; font-size: 10px; font-weight: 900; letter-spacing: 1.2px; }

      .step-mask { fill: #0f172a; }
      .step { stroke-width: 1.7; filter: url(#node-glow); }
      .step-boundary { fill: rgba(8, 51, 68, 0.44); stroke: #22d3ee; }
      .step-manual { fill: rgba(6, 78, 59, 0.44); stroke: #34d399; }
      .step-automated { fill: rgba(76, 29, 149, 0.44); stroke: #a78bfa; }
      .step-integration { fill: rgba(120, 53, 15, 0.36); stroke: #fbbf24; }
      .decision { fill: rgba(136, 19, 55, 0.44); stroke: #fb7185; stroke-width: 1.7; filter: url(#node-glow-rose); }
      .exception-node { fill: rgba(136, 19, 55, 0.20); stroke: #fb7185; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .artifact { fill: rgba(49, 46, 129, 0.38); stroke: #818cf8; stroke-width: 1.4; }

      .num { stroke: rgba(248, 250, 252, 0.40); stroke-width: 1; }
      .num-boundary { fill: #0891b2; }
      .num-manual { fill: #059669; }
      .num-automated { fill: #7c3aed; }
      .num-integration { fill: #d97706; }
      .num-text { fill: #ffffff; font-size: 9px; font-weight: 900; }
      .actor { font-size: 9px; font-weight: 900; letter-spacing: 0.9px; }
      .actor.manual { fill: #6ee7b7; }
      .actor.automated { fill: #c4b5fd; }
      .actor.integration { fill: #fcd34d; }
      .step-title { fill: #f8fafc; font-size: 13px; font-weight: 900; }
      .step-detail { fill: #cbd5e1; font-size: 10px; font-weight: 650; }
      .pill-text { fill: #f8fafc; font-size: 12px; font-weight: 900; }
      .decision-text { fill: #f8fafc; font-size: 12px; font-weight: 900; }
      .decision-subtext { fill: #fecdd3; font-size: 9px; font-weight: 750; }

      .flow { fill: none; stroke: #94a3b8; stroke-width: 2; opacity: 0.95; marker-end: url(#arrow); }
      .flow-exception { fill: none; stroke: #fb7185; stroke-width: 1.9; stroke-dasharray: 7 5; marker-end: url(#arrow-exception); }
      .flow-loop { fill: none; stroke: #22d3ee; stroke-width: 1.8; stroke-dasharray: 8 6; marker-end: url(#arrow-loop); }
      .flow-label { fill: #cbd5e1; font-size: 9px; font-weight: 850; }
      .flow-label.exception { fill: #fda4af; }
      .flow-label.loop { fill: #67e8f9; }
      .flow-label.success { fill: #6ee7b7; }

      .summary-card { fill: rgba(15, 23, 42, 0.72); stroke: #1e293b; stroke-width: 1.1; }
      .summary-title { fill: #f8fafc; font-size: 12px; font-weight: 900; }
      .summary-text { fill: #94a3b8; font-size: 10px; font-weight: 650; }
      .legend-title { fill: #f8fafc; font-size: 11px; font-weight: 900; }
      .legend-text { fill: #cbd5e1; font-size: 10px; font-weight: 700; }
    ]]></style>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 40 0 L 0 0 0 40" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#38bdf8" flood-opacity="0.12"/>
    </filter>

    <filter id="node-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fb7185" flood-opacity="0.18"/>
    </filter>

    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#94a3b8"/>
    </marker>

    <marker id="arrow-exception" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#fb7185"/>
    </marker>

    <marker id="arrow-loop" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1500" height="900"/>
  <rect width="1500" height="900" fill="url(#grid)" opacity="0.55"/>
  <rect class="surface" x="36" y="32" width="1428" height="836" rx="22"/>

  <circle class="status-dot" cx="78" cy="70" r="4"/>
  <text class="eyebrow" x="94" y="74">PROCESS FLOW</text>
  <text class="title" x="72" y="116">[PROCESS_NAME]</text>
  <text class="subtitle" x="72" y="145">[PROCESS_DESCRIPTION] - Owner: [OWNER_TEAM] - Version: [VERSION_OR_DATE]</text>
  <line class="header-line" x1="72" y1="170" x2="1428" y2="170"/>

  <rect class="pre-box" x="72" y="196" width="1356" height="62" rx="14"/>
  <text class="pre-title" x="96" y="232">PREREQUISITES</text>
  <rect class="chip" x="230" y="213" width="190" height="28" rx="14"/>
  <text class="chip-text" x="325" y="232" text-anchor="middle">[Prerequisite 1]</text>
  <rect class="chip" x="438" y="213" width="190" height="28" rx="14"/>
  <text class="chip-text" x="533" y="232" text-anchor="middle">[Prerequisite 2]</text>
  <rect class="chip" x="646" y="213" width="190" height="28" rx="14"/>
  <text class="chip-text" x="741" y="232" text-anchor="middle">[Prerequisite 3]</text>
  <rect class="chip" x="854" y="213" width="210" height="28" rx="14"/>
  <text class="chip-text" x="959" y="232" text-anchor="middle">[Access / Tooling]</text>

  <rect class="lane" x="72" y="286" width="1356" height="118" rx="14"/>
  <text class="lane-title" x="96" y="310">HAPPY PATH</text>
  <rect class="lane" x="72" y="430" width="1356" height="94" rx="14"/>
  <text class="lane-title" x="96" y="454">EXCEPTION / REWORK</text>

  <!-- Draw arrows before steps so connectors stay behind the process cards. -->
  <path class="flow" d="M 182 345 L 220 345"/>
  <text class="flow-label" x="201" y="331" text-anchor="middle">trigger</text>
  <path class="flow" d="M 400 345 L 470 345"/>
  <text class="flow-label" x="435" y="331" text-anchor="middle">input</text>
  <path class="flow" d="M 650 345 L 700 345"/>
  <text class="flow-label" x="675" y="331" text-anchor="middle">validated</text>
  <path class="flow" d="M 820 345 L 900 345"/>
  <text class="flow-label success" x="860" y="331" text-anchor="middle">Yes</text>
  <path class="flow" d="M 1080 345 L 1155 345"/>
  <text class="flow-label" x="1118" y="331" text-anchor="middle">result</text>
  <path class="flow" d="M 1335 345 L 1370 345"/>
  <text class="flow-label" x="1352" y="331" text-anchor="middle">done</text>

  <path class="flow-exception" d="M 760 405 C 760 430, 760 452, 760 474"/>
  <text class="flow-label exception" x="795" y="444">No / Rejected</text>
  <path class="flow-exception" d="M 702 478 C 580 540, 320 540, 310 405"/>
  <text class="flow-label exception" x="496" y="535" text-anchor="middle">rework needed</text>
  <path class="flow-loop" d="M 1245 295 C 1245 248, 560 248, 560 295"/>
  <text class="flow-label loop" x="905" y="246" text-anchor="middle">optional monitor</text>

  <g data-step="start" data-type="start">
    <rect class="step-mask" x="70" y="323" width="112" height="44" rx="22"/>
    <rect class="step step-boundary" x="70" y="323" width="112" height="44" rx="22"/>
    <text class="pill-text" x="126" y="351" text-anchor="middle">Start</text>
  </g>

  <g data-step="1" data-type="manual">
    <rect class="step-mask" x="220" y="296" width="180" height="98" rx="12"/>
    <rect class="step step-manual" x="220" y="296" width="180" height="98" rx="12"/>
    <circle class="num num-manual" cx="244" cy="320" r="13"/>
    <text class="num-text" x="244" y="324" text-anchor="middle">1</text>
    <text class="actor manual" x="272" y="324">USER</text>
    <text class="step-title" x="310" y="351" text-anchor="middle">Manual Step</text>
    <text class="step-detail" x="310" y="372" text-anchor="middle">submit / review</text>
  </g>

  <g data-step="2" data-type="automated">
    <rect class="step-mask" x="470" y="296" width="180" height="98" rx="12"/>
    <rect class="step step-automated" x="470" y="296" width="180" height="98" rx="12"/>
    <circle class="num num-automated" cx="494" cy="320" r="13"/>
    <text class="num-text" x="494" y="324" text-anchor="middle">2</text>
    <text class="actor automated" x="522" y="324">SYSTEM</text>
    <text class="step-title" x="560" y="351" text-anchor="middle">Automated Step</text>
    <text class="step-detail" x="560" y="372" text-anchor="middle">validate + process</text>
  </g>

  <g data-step="3" data-type="decision">
    <polygon class="step-mask" points="760,285 820,345 760,405 700,345"/>
    <polygon class="decision" points="760,285 820,345 760,405 700,345"/>
    <text class="decision-text" x="760" y="340" text-anchor="middle">Decision?</text>
    <text class="decision-subtext" x="760" y="360" text-anchor="middle">Yes / No</text>
  </g>

  <g data-step="4" data-type="integration">
    <rect class="step-mask" x="900" y="296" width="180" height="98" rx="12"/>
    <rect class="step step-integration" x="900" y="296" width="180" height="98" rx="12"/>
    <circle class="num num-integration" cx="924" cy="320" r="13"/>
    <text class="num-text" x="924" y="324" text-anchor="middle">4</text>
    <text class="actor integration" x="952" y="324">API</text>
    <text class="step-title" x="990" y="351" text-anchor="middle">Integration</text>
    <text class="step-detail" x="990" y="372" text-anchor="middle">external handoff</text>
  </g>

  <g data-step="5" data-type="automated">
    <rect class="step-mask" x="1155" y="296" width="180" height="98" rx="12"/>
    <rect class="step step-automated" x="1155" y="296" width="180" height="98" rx="12"/>
    <circle class="num num-automated" cx="1179" cy="320" r="13"/>
    <text class="num-text" x="1179" y="324" text-anchor="middle">5</text>
    <text class="actor automated" x="1207" y="324">SYSTEM</text>
    <text class="step-title" x="1245" y="351" text-anchor="middle">Finalize</text>
    <text class="step-detail" x="1245" y="372" text-anchor="middle">notify + record</text>
  </g>

  <g data-step="end" data-type="end">
    <rect class="step-mask" x="1370" y="323" width="58" height="44" rx="22"/>
    <rect class="step step-boundary" x="1370" y="323" width="58" height="44" rx="22"/>
    <text class="pill-text" x="1399" y="351" text-anchor="middle">End</text>
  </g>

  <g data-step="exception" data-type="exception">
    <rect class="step-mask" x="660" y="474" width="200" height="38" rx="19"/>
    <rect class="exception-node" x="660" y="474" width="200" height="38" rx="19"/>
    <text class="step-detail" x="760" y="498" text-anchor="middle">Reject / Escalate / Rework</text>
  </g>

  <g data-artifact="output">
    <rect class="artifact" x="1166" y="430" width="158" height="40" rx="10"/>
    <text class="step-detail" x="1245" y="455" text-anchor="middle">[Output Artifact]</text>
    <path class="flow" d="M 1245 394 L 1245 430"/>
  </g>

  <g transform="translate(86 568)">
    <text class="legend-title" x="0" y="0">LEGEND</text>
    <rect class="step step-boundary" x="0" y="18" width="18" height="12" rx="4"/>
    <text class="legend-text" x="28" y="29">Start / End</text>
    <rect class="step step-manual" x="142" y="18" width="18" height="12" rx="4"/>
    <text class="legend-text" x="170" y="29">Manual</text>
    <rect class="step step-automated" x="250" y="18" width="18" height="12" rx="4"/>
    <text class="legend-text" x="278" y="29">Automated</text>
    <rect class="step step-integration" x="384" y="18" width="18" height="12" rx="4"/>
    <text class="legend-text" x="412" y="29">Integration</text>
    <polygon class="decision" points="548,18 560,30 548,42 536,30"/>
    <text class="legend-text" x="574" y="34">Decision</text>
    <line x1="674" y1="29" x2="720" y2="29" class="flow-exception"/>
    <text class="legend-text" x="732" y="34">Exception path</text>
    <line x1="874" y1="29" x2="920" y2="29" class="flow-loop"/>
    <text class="legend-text" x="932" y="34">Loop-back</text>
  </g>

  <g transform="translate(72 650)">
    <rect class="summary-card" x="0" y="0" width="420" height="120" rx="16"/>
    <text class="summary-title" x="24" y="32">Prerequisites</text>
    <text class="summary-text" x="24" y="58">- [Required setup item 1]</text>
    <text class="summary-text" x="24" y="78">- [Access / approval / configuration]</text>
    <text class="summary-text" x="24" y="98">- [Policy or dependency]</text>
  </g>

  <g transform="translate(540 650)">
    <rect class="summary-card" x="0" y="0" width="420" height="120" rx="16"/>
    <text class="summary-title" x="24" y="32">Inputs / Outputs</text>
    <text class="summary-text" x="24" y="58">- Input: [source data / request]</text>
    <text class="summary-text" x="24" y="78">- Output: [approved result / artifact]</text>
    <text class="summary-text" x="24" y="98">- Branches: [approve / reject / rework]</text>
  </g>

  <g transform="translate(1008 650)">
    <rect class="summary-card" x="0" y="0" width="420" height="120" rx="16"/>
    <text class="summary-title" x="24" y="32">Tools and Integrations</text>
    <text class="summary-text" x="24" y="58">- [Tool / system 1]</text>
    <text class="summary-text" x="24" y="78">- [External API / service]</text>
    <text class="summary-text" x="24" y="98">- [Notification / storage / audit]</text>
  </g>

  <text class="footer" x="72" y="828">[Process Name] - [Owner/Team] - [Version/Date] - Generated as standalone SVG</text>
</svg>
