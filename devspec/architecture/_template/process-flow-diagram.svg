<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">[PROCESS_NAME] - Process Flow</title>
  <desc id="desc">[PROCESS_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .header-line { stroke: #1e293b; stroke-width: 1; opacity: 0.95; }
      .status-dot { fill: #22d3ee; filter: url(#cyan-glow); }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 15px; font-weight: 500; }
      .footer { fill: #64748b; font-size: 12px; font-weight: 600; }

      .pre-box { fill: rgba(30, 41, 59, 0.42); stroke: #334155; stroke-width: 1.2; stroke-dasharray: 8 6; }
      .pre-title { fill: #67e8f9; font-size: 12px; font-weight: 900; letter-spacing: 1.2px; }
      .chip { fill: rgba(15, 23, 42, 0.92); stroke: #334155; stroke-width: 1; }
      .chip-text { fill: #cbd5e1; font-size: 11px; font-weight: 700; }

      .lane { fill: rgba(15, 23, 42, 0.20); stroke: #334155; stroke-width: 1.1; stroke-dasharray: 8 8; }
      .lane-title { fill: #94a3b8; font-size: 12px; font-weight: 900; letter-spacing: 1.2px; }
      .lane-title.success { fill: #6ee7b7; }
      .lane-title.exception { fill: #fda4af; }

      .step-mask { fill: #0f172a; }
      .step { stroke-width: 1.8; filter: url(#node-glow); }
      .step-boundary { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .step-manual { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .step-automated { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .step-integration { fill: rgba(120, 53, 15, 0.40); stroke: #fbbf24; }
      .decision { fill: rgba(136, 19, 55, 0.46); stroke: #fb7185; stroke-width: 1.8; filter: url(#node-glow-rose); }
      .exception-node { fill: rgba(136, 19, 55, 0.22); stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .artifact { fill: rgba(49, 46, 129, 0.44); stroke: #818cf8; stroke-width: 1.5; }

      .num { stroke: rgba(248, 250, 252, 0.42); stroke-width: 1; }
      .num-boundary { fill: #0891b2; }
      .num-manual { fill: #059669; }
      .num-automated { fill: #7c3aed; }
      .num-integration { fill: #d97706; }
      .num-text { fill: #ffffff; font-size: 10px; font-weight: 900; }
      .actor { font-size: 10px; font-weight: 900; letter-spacing: 0.9px; }
      .actor.manual { fill: #6ee7b7; }
      .actor.automated { fill: #c4b5fd; }
      .actor.integration { fill: #fcd34d; }
      .step-title { fill: #f8fafc; font-size: 14px; font-weight: 900; }
      .step-detail { fill: #cbd5e1; font-size: 11px; font-weight: 650; }
      .pill-text { fill: #f8fafc; font-size: 13px; font-weight: 900; }
      .decision-text { fill: #f8fafc; font-size: 13px; font-weight: 900; }
      .decision-subtext { fill: #fecdd3; font-size: 10px; font-weight: 750; }

      .flow { fill: none; stroke: #e2e8f0; stroke-width: 2.2; opacity: 0.92; marker-end: url(#arrow); }
      .flow-secondary { stroke: #94a3b8; stroke-dasharray: 7 5; marker-end: url(#arrow-secondary); }
      .flow-exception { fill: none; stroke: #fb7185; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-exception); }
      .flow-loop { fill: none; stroke: #22d3ee; stroke-width: 1.9; stroke-dasharray: 8 6; marker-end: url(#arrow-loop); }
      .flow-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .flow-label { fill: #f8fafc; font-size: 11px; font-weight: 850; }
      .flow-label.exception { fill: #fda4af; }
      .flow-label.loop { fill: #67e8f9; }
      .flow-label.success { fill: #6ee7b7; }

      .summary-card { fill: rgba(15, 23, 42, 0.76); stroke: #334155; stroke-width: 1.1; }
      .summary-title { fill: #f8fafc; font-size: 13px; font-weight: 900; }
      .summary-text { fill: #94a3b8; font-size: 11px; font-weight: 650; }
      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 13px; font-weight: 900; }
      .legend-text { fill: #cbd5e1; font-size: 11px; font-weight: 700; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <filter id="node-glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#fb7185" flood-opacity="0.18"/>
    </filter>

    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>

    <marker id="arrow-exception" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>

    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <circle class="status-dot" cx="92" cy="92" r="5"/>
  <text class="eyebrow" x="112" y="97">PROCESS FLOW</text>
  <text class="title" x="92" y="144">[PROCESS_NAME]</text>
  <text class="subtitle" x="92" y="174">[PROCESS_DESCRIPTION] - Owner: [OWNER_TEAM] - Version: [VERSION_OR_DATE]</text>
  <line class="header-line" x1="92" y1="200" x2="1508" y2="200"/>

  <rect class="pre-box" x="92" y="222" width="1416" height="62" rx="14"/>
  <text class="pre-title" x="116" y="259">PREREQUISITES</text>
  <rect class="chip" x="260" y="239" width="190" height="28" rx="14"/>
  <text class="chip-text" x="355" y="258" text-anchor="middle">[Prerequisite 1]</text>
  <rect class="chip" x="468" y="239" width="190" height="28" rx="14"/>
  <text class="chip-text" x="563" y="258" text-anchor="middle">[Prerequisite 2]</text>
  <rect class="chip" x="676" y="239" width="190" height="28" rx="14"/>
  <text class="chip-text" x="771" y="258" text-anchor="middle">[Prerequisite 3]</text>
  <rect class="chip" x="884" y="239" width="230" height="28" rx="14"/>
  <text class="chip-text" x="999" y="258" text-anchor="middle">[Access / Tooling]</text>

  <rect class="lane" x="92" y="316" width="1416" height="132" rx="16"/>
  <text class="lane-title success" x="116" y="342">HAPPY PATH</text>
  <rect class="lane" x="92" y="474" width="1416" height="96" rx="16"/>
  <text class="lane-title exception" x="116" y="500">EXCEPTION / REWORK</text>

  <!-- Draw arrows before steps so connectors stay behind the process cards. -->
  <path class="flow" d="M 222 386 L 262 386"/>
  <rect class="flow-label-bg" x="210" y="356" width="66" height="23" rx="7"/>
  <text class="flow-label" x="243" y="372" text-anchor="middle">Trigger</text>

  <path class="flow" d="M 452 386 L 526 386"/>
  <rect class="flow-label-bg" x="456" y="356" width="66" height="23" rx="7"/>
  <text class="flow-label" x="489" y="372" text-anchor="middle">Input</text>

  <path class="flow" d="M 716 386 L 765 386"/>
  <rect class="flow-label-bg" x="704" y="356" width="74" height="23" rx="7"/>
  <text class="flow-label" x="741" y="372" text-anchor="middle">Validate</text>

  <path class="flow" d="M 885 386 L 966 386"/>
  <rect class="flow-label-bg" x="900" y="356" width="52" height="23" rx="7"/>
  <text class="flow-label success" x="926" y="372" text-anchor="middle">Yes</text>

  <path class="flow" d="M 1156 386 L 1235 386"/>
  <rect class="flow-label-bg" x="1162" y="356" width="68" height="23" rx="7"/>
  <text class="flow-label" x="1196" y="372" text-anchor="middle">Result</text>

  <path class="flow" d="M 1425 386 L 1460 386"/>
  <rect class="flow-label-bg" x="1414" y="356" width="58" height="23" rx="7"/>
  <text class="flow-label" x="1443" y="372" text-anchor="middle">Done</text>

  <path class="flow-exception" d="M 825 446 C 825 470, 825 493, 825 518"/>
  <text class="flow-label exception" x="858" y="486">No / Rejected</text>
  <path class="flow-exception" d="M 765 522 C 640 590, 360 590, 352 448"/>
  <text class="flow-label exception" x="548" y="590" text-anchor="middle">Rework needed</text>
  <path class="flow-loop" d="M 1325 336 C 1325 296, 610 296, 610 336"/>
  <text class="flow-label loop" x="968" y="294" text-anchor="middle">Optional monitor</text>

  <g data-step="start" data-type="start">
    <rect class="step-mask" x="112" y="361" width="110" height="50" rx="25"/>
    <rect class="step step-boundary" x="112" y="361" width="110" height="50" rx="25"/>
    <text class="pill-text" x="167" y="392" text-anchor="middle">Start</text>
  </g>

  <g data-step="1" data-type="manual">
    <rect class="step-mask" x="262" y="337" width="190" height="98" rx="12"/>
    <rect class="step step-manual" x="262" y="337" width="190" height="98" rx="12"/>
    <circle class="num num-manual" cx="287" cy="362" r="14"/>
    <text class="num-text" x="287" y="366" text-anchor="middle">1</text>
    <text class="actor manual" x="318" y="366">USER</text>
    <text class="step-title" x="357" y="392" text-anchor="middle">Manual Step</text>
    <text class="step-detail" x="357" y="414" text-anchor="middle">submit / review</text>
  </g>

  <g data-step="2" data-type="automated">
    <rect class="step-mask" x="526" y="337" width="190" height="98" rx="12"/>
    <rect class="step step-automated" x="526" y="337" width="190" height="98" rx="12"/>
    <circle class="num num-automated" cx="551" cy="362" r="14"/>
    <text class="num-text" x="551" y="366" text-anchor="middle">2</text>
    <text class="actor automated" x="582" y="366">SYSTEM</text>
    <text class="step-title" x="621" y="392" text-anchor="middle">Automated Step</text>
    <text class="step-detail" x="621" y="414" text-anchor="middle">validate + process</text>
  </g>

  <g data-step="3" data-type="decision">
    <polygon class="step-mask" points="825,326 885,386 825,446 765,386"/>
    <polygon class="decision" points="825,326 885,386 825,446 765,386"/>
    <text class="decision-text" x="825" y="381" text-anchor="middle">Decision?</text>
    <text class="decision-subtext" x="825" y="401" text-anchor="middle">Yes / No</text>
  </g>

  <g data-step="4" data-type="integration">
    <rect class="step-mask" x="966" y="337" width="190" height="98" rx="12"/>
    <rect class="step step-integration" x="966" y="337" width="190" height="98" rx="12"/>
    <circle class="num num-integration" cx="991" cy="362" r="14"/>
    <text class="num-text" x="991" y="366" text-anchor="middle">4</text>
    <text class="actor integration" x="1022" y="366">API</text>
    <text class="step-title" x="1061" y="392" text-anchor="middle">Integration</text>
    <text class="step-detail" x="1061" y="414" text-anchor="middle">external handoff</text>
  </g>

  <g data-step="5" data-type="automated">
    <rect class="step-mask" x="1235" y="337" width="190" height="98" rx="12"/>
    <rect class="step step-automated" x="1235" y="337" width="190" height="98" rx="12"/>
    <circle class="num num-automated" cx="1260" cy="362" r="14"/>
    <text class="num-text" x="1260" y="366" text-anchor="middle">5</text>
    <text class="actor automated" x="1291" y="366">SYSTEM</text>
    <text class="step-title" x="1330" y="392" text-anchor="middle">Finalize</text>
    <text class="step-detail" x="1330" y="414" text-anchor="middle">notify + record</text>
  </g>

  <g data-step="end" data-type="end">
    <rect class="step-mask" x="1460" y="361" width="48" height="50" rx="24"/>
    <rect class="step step-boundary" x="1460" y="361" width="48" height="50" rx="24"/>
    <text class="pill-text" x="1484" y="392" text-anchor="middle">End</text>
  </g>

  <g data-step="exception" data-type="exception">
    <rect class="step-mask" x="720" y="518" width="210" height="40" rx="20"/>
    <rect class="exception-node" x="720" y="518" width="210" height="40" rx="20"/>
    <text class="step-detail" x="825" y="543" text-anchor="middle">Reject / Escalate / Rework</text>
  </g>

  <g data-artifact="output">
    <rect class="artifact" x="1248" y="474" width="164" height="42" rx="10"/>
    <text class="step-detail" x="1330" y="500" text-anchor="middle">[Output Artifact]</text>
    <path class="flow-secondary" d="M 1330 435 L 1330 474"/>
  </g>

  <g class="legend" transform="translate(92 614)">
    <rect class="legend-panel" x="0" y="0" width="700" height="82" rx="14"/>
    <text class="legend-title" x="24" y="32">Legend</text>
    <rect class="step step-boundary" x="24" y="48" width="20" height="14" rx="5"/>
    <text class="legend-text" x="56" y="60">Start / End</text>
    <rect class="step step-manual" x="156" y="48" width="20" height="14" rx="5"/>
    <text class="legend-text" x="188" y="60">Manual</text>
    <rect class="step step-automated" x="270" y="48" width="20" height="14" rx="5"/>
    <text class="legend-text" x="302" y="60">Automated</text>
    <rect class="step step-integration" x="410" y="48" width="20" height="14" rx="5"/>
    <text class="legend-text" x="442" y="60">Integration</text>
    <polygon class="decision" points="552,46 566,60 552,74 538,60"/>
    <text class="legend-text" x="580" y="64">Decision</text>
  </g>

  <g class="legend" transform="translate(836 614)">
    <rect class="legend-panel" x="0" y="0" width="672" height="82" rx="14"/>
    <text class="legend-title" x="24" y="32">Flow Types</text>
    <line class="flow" x1="24" y1="56" x2="74" y2="56"/>
    <text class="legend-text" x="92" y="60">Happy path</text>
    <line class="flow-exception" x1="220" y1="56" x2="270" y2="56"/>
    <text class="legend-text" x="288" y="60">Exception path</text>
    <line class="flow-loop" x1="450" y1="56" x2="500" y2="56"/>
    <text class="legend-text" x="518" y="60">Loop-back</text>
  </g>

  <g transform="translate(92 724)">
    <rect class="summary-card" x="0" y="0" width="420" height="84" rx="14"/>
    <text class="summary-title" x="24" y="30">Prerequisites</text>
    <text class="summary-text" x="24" y="56">- [Required setup item 1]</text>
    <text class="summary-text" x="24" y="74">- [Access / approval / configuration]</text>
  </g>

  <g transform="translate(590 724)">
    <rect class="summary-card" x="0" y="0" width="420" height="84" rx="14"/>
    <text class="summary-title" x="24" y="30">Inputs / Outputs</text>
    <text class="summary-text" x="24" y="56">- Input: [source data / request]</text>
    <text class="summary-text" x="24" y="74">- Output: [approved result / artifact]</text>
  </g>

  <g transform="translate(1088 724)">
    <rect class="summary-card" x="0" y="0" width="420" height="84" rx="14"/>
    <text class="summary-title" x="24" y="30">Tools and Integrations</text>
    <text class="summary-text" x="24" y="56">- [Tool / system 1]</text>
    <text class="summary-text" x="24" y="74">- [External API / service]</text>
  </g>

  <text class="footer" x="92" y="830">[Process Name] - [Owner/Team] - [Version/Date] - Generated by devspec</text>
</svg>
