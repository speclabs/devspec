<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">[DIAGRAM_TITLE] - Infrastructure Topology Diagram</title>
  <desc id="desc">[DIAGRAM_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; font-weight: 500; }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .footer { fill: #64748b; font-size: 12px; }

      .environment { fill: rgba(15, 23, 42, 0.24); stroke: #334155; stroke-width: 1.3; stroke-dasharray: 10 8; }
      .environment-title { fill: #94a3b8; font-size: 13px; font-weight: 900; letter-spacing: 1.2px; }

      .zone { fill: rgba(15, 23, 42, 0.20); stroke-width: 1.6; stroke-dasharray: 8 7; }
      .zone-provider { stroke: #34d399; }
      .zone-external { stroke: #fbbf24; }
      .zone-title { font-size: 13px; font-weight: 800; letter-spacing: 0.7px; }
      .zone-title.provider { fill: #6ee7b7; }
      .zone-title.external { fill: #fcd34d; }

      .node-mask { fill: #0f172a; }
      .node { stroke-width: 1.8; filter: url(#node-glow); }
      .node-edge { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .node-compute { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .node-data { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .node-external { fill: rgba(120, 53, 15, 0.40); stroke: #fbbf24; }

      .node-title { fill: #f8fafc; font-size: 16px; font-weight: 800; }
      .node-meta { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
      .node-tag { fill: #94a3b8; font-size: 11px; font-weight: 600; }

      .link { fill: none; stroke: #e2e8f0; stroke-width: 2.2; opacity: 0.92; }
      .link-secondary { stroke: #94a3b8; stroke-dasharray: 8 6; }
      .link-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .link-label { fill: #f8fafc; font-size: 12px; font-weight: 800; }

      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 14px; font-weight: 800; }
      .legend-text { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <text class="eyebrow" x="92" y="92">[PROJECT_NAME]</text>
  <text class="title" x="92" y="138">[DIAGRAM_TITLE]</text>
  <text class="subtitle" x="92" y="168">[DIAGRAM_DESCRIPTION]</text>

  <g data-environment="primary">
    <rect class="environment" x="104" y="214" width="1404" height="276" rx="20"/>
    <text class="environment-title" x="130" y="242">[ENVIRONMENT_PRIMARY]</text>
  </g>

  <g data-environment="secondary">
    <rect class="environment" x="104" y="546" width="1404" height="168" rx="20"/>
    <text class="environment-title" x="130" y="574">[ENVIRONMENT_SECONDARY]</text>
  </g>

  <g data-zone="primary-provider">
    <rect class="zone zone-provider" x="140" y="256" width="900" height="202" rx="16"/>
    <text class="zone-title provider" x="164" y="282">[PROVIDER_OR_REGION]</text>
  </g>

  <g data-zone="primary-external">
    <rect class="zone zone-external" x="1140" y="256" width="340" height="202" rx="16"/>
    <text class="zone-title external" x="1164" y="282">[EXTERNAL_DEPENDENCY]</text>
  </g>

  <g data-zone="secondary-provider">
    <rect class="zone zone-provider" x="140" y="582" width="900" height="118" rx="16"/>
    <text class="zone-title provider" x="164" y="606">[PROVIDER_OR_REGION]</text>
  </g>

  <!-- Draw links before nodes so connectors stay behind the cards.
       Every link starts and ends on a node edge; labels name the protocol or channel, not a step order. -->
  <path class="link" d="M 376 336 L 496 336" marker-end="url(#arrow)"/>
  <rect class="link-label-bg" x="404" y="324" width="66" height="24" rx="7"/>
  <text class="link-label" x="437" y="341" text-anchor="middle">HTTPS</text>

  <path class="link" d="M 696 336 L 816 336" marker-end="url(#arrow)"/>
  <rect class="link-label-bg" x="726" y="324" width="60" height="24" rx="7"/>
  <text class="link-label" x="756" y="341" text-anchor="middle">TLS</text>

  <path class="link" d="M 596 384 C 596 428, 1310 428, 1310 384" marker-end="url(#arrow)"/>
  <rect class="link-label-bg" x="906" y="405" width="88" height="24" rx="7"/>
  <text class="link-label" x="950" y="422" text-anchor="middle">Egress</text>

  <path class="link link-secondary" d="M 916 384 L 916 588" marker-end="url(#arrow-secondary)"/>
  <rect class="link-label-bg" x="938" y="506" width="118" height="24" rx="7"/>
  <text class="link-label" x="997" y="523" text-anchor="middle">Replication</text>

  <path class="link" d="M 696 631 L 816 631" marker-end="url(#arrow)"/>
  <rect class="link-label-bg" x="726" y="619" width="60" height="24" rx="7"/>
  <text class="link-label" x="756" y="636" text-anchor="middle">TLS</text>

  <g class="node-group" data-node="edge">
    <rect class="node-mask" x="176" y="288" width="200" height="96" rx="12"/>
    <rect class="node node-edge" x="176" y="288" width="200" height="96" rx="12"/>
    <text class="node-title" x="276" y="322" text-anchor="middle">Edge</text>
    <text class="node-meta" x="276" y="346" text-anchor="middle">Ingress / DNS</text>
    <text class="node-tag" x="276" y="368" text-anchor="middle">Replace me</text>
  </g>

  <g class="node-group" data-node="runtime">
    <rect class="node-mask" x="496" y="288" width="200" height="96" rx="12"/>
    <rect class="node node-compute" x="496" y="288" width="200" height="96" rx="12"/>
    <text class="node-title" x="596" y="322" text-anchor="middle">Runtime Host</text>
    <text class="node-meta" x="596" y="346" text-anchor="middle">Compute</text>
    <text class="node-tag" x="596" y="368" text-anchor="middle">Replace me</text>
  </g>

  <g class="node-group" data-node="managed-data">
    <rect class="node-mask" x="816" y="288" width="200" height="96" rx="12"/>
    <rect class="node node-data" x="816" y="288" width="200" height="96" rx="12"/>
    <text class="node-title" x="916" y="322" text-anchor="middle">Managed Data</text>
    <text class="node-meta" x="916" y="346" text-anchor="middle">Primary store</text>
    <text class="node-tag" x="916" y="368" text-anchor="middle">Replace me</text>
  </g>

  <g class="node-group" data-node="external-service">
    <rect class="node-mask" x="1180" y="288" width="260" height="96" rx="12"/>
    <rect class="node node-external" x="1180" y="288" width="260" height="96" rx="12"/>
    <text class="node-title" x="1310" y="322" text-anchor="middle">Third-Party API</text>
    <text class="node-meta" x="1310" y="346" text-anchor="middle">Outside control</text>
    <text class="node-tag" x="1310" y="368" text-anchor="middle">Replace me</text>
  </g>

  <g class="node-group" data-node="standby-runtime">
    <rect class="node-mask" x="496" y="588" width="200" height="86" rx="12"/>
    <rect class="node node-compute" x="496" y="588" width="200" height="86" rx="12"/>
    <text class="node-title" x="596" y="620" text-anchor="middle">Standby Host</text>
    <text class="node-meta" x="596" y="643" text-anchor="middle">Compute</text>
    <text class="node-tag" x="596" y="664" text-anchor="middle">Replace me</text>
  </g>

  <g class="node-group" data-node="replica-data">
    <rect class="node-mask" x="816" y="588" width="200" height="86" rx="12"/>
    <rect class="node node-data" x="816" y="588" width="200" height="86" rx="12"/>
    <text class="node-title" x="916" y="620" text-anchor="middle">Replica Data</text>
    <text class="node-meta" x="916" y="643" text-anchor="middle">Read replica</text>
    <text class="node-tag" x="916" y="664" text-anchor="middle">Replace me</text>
  </g>

  <g class="legend" transform="translate(400 730)">
    <rect class="legend-panel" x="0" y="0" width="1108" height="76" rx="14"/>
    <text class="legend-title" x="24" y="48">Legend</text>
    <rect class="node node-edge" x="130" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="164" y="52">Edge</text>
    <rect class="node node-compute" x="240" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="274" y="52">Compute</text>
    <rect class="node node-data" x="400" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="434" y="52">Managed data</text>
    <rect class="node node-external" x="610" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="644" y="52">External</text>
    <line class="link" x1="760" y1="47" x2="802" y2="47" marker-end="url(#arrow)"/>
    <text class="legend-text" x="818" y="52">Network path</text>
    <line class="link link-secondary" x1="960" y1="47" x2="1002" y2="47" marker-end="url(#arrow-secondary)"/>
    <text class="legend-text" x="1018" y="52">Replication</text>
  </g>

  <text class="footer" x="92" y="838">Generated by devspec - [DATE_OR_VERSION]</text>
</svg>
