<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[DIAGRAM_TITLE]</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: #334155;
      --accent: #38bdf8;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }

    article {
      width: min(100%, 1600px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
    }

    header {
      margin-bottom: 18px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .diagram {
      overflow: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #020617;
    }

    .diagram svg {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <div class="eyebrow">[PROJECT_NAME]</div>
        <h1>[DIAGRAM_TITLE]</h1>
        <p>[DIAGRAM_DESCRIPTION]</p>
      </header>
      <section class="diagram" aria-label="[DIAGRAM_TITLE]">
        [INLINE_SVG_OR_STATIC_DIAGRAM]
      </section>
      <footer>Generated by devspec - [DATE_OR_VERSION]</footer>
    </article>
  </main>
</body>
</html>
