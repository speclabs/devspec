<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[DIAGRAM_TITLE]</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: #0f172a;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --subtle: #94a3b8;
      --line: #334155;
      --grid: #1e293b;
      --accent: #38bdf8;
      --accent-2: #34d399;
    }

    body {
      margin: 0;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: 48px 48px;
      color: var(--text);
      font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      box-sizing: border-box;
    }

    article {
      width: min(100%, 1600px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px;
      box-sizing: border-box;
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.34);
    }

    header {
      margin-bottom: 22px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 20px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1.1;
      font-weight: 900;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .diagram {
      overflow: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        #020617;
      background-size: 48px 48px;
    }

    .diagram svg {
      display: block;
      width: 100%;
      height: auto;
    }

    footer {
      margin-top: 14px;
      color: var(--subtle);
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <div class="eyebrow">[PROJECT_NAME]</div>
        <h1>[DIAGRAM_TITLE]</h1>
        <p>[DIAGRAM_DESCRIPTION]</p>
      </header>
      <section class="diagram" aria-label="[DIAGRAM_TITLE]">
        [INLINE_SVG_OR_STATIC_DIAGRAM]
      </section>
      <footer>Generated by devspec - [DATE_OR_VERSION]</footer>
    </article>
  </main>
</body>
</html>
