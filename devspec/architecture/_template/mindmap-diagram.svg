<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">[DIAGRAM_TITLE] - Mindmap Diagram</title>
  <desc id="desc">[DIAGRAM_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; font-weight: 500; }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .footer { fill: #64748b; font-size: 12px; }

      .branch { fill: none; stroke: #e2e8f0; stroke-width: 2.2; opacity: 0.92; }
      .branch-secondary { stroke: #94a3b8; stroke-dasharray: 7 5; }
      .branch-event { stroke: #fb923c; stroke-dasharray: 9 5; }
      .branch-security { stroke: #fb7185; stroke-dasharray: 7 6; }

      .topic-mask { fill: #0f172a; }
      .topic { stroke-width: 1.8; filter: url(#node-glow); }
      .topic-root { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .topic-service { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .topic-data { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .topic-external { fill: rgba(120, 53, 15, 0.40); stroke: #fbbf24; }
      .topic-security { fill: rgba(136, 19, 55, 0.46); stroke: #fb7185; }
      .topic-event { fill: rgba(124, 45, 18, 0.42); stroke: #fb923c; }
      .topic-title { fill: #f8fafc; font-size: 15px; font-weight: 900; }
      .topic-meta { fill: #cbd5e1; font-size: 11px; font-weight: 650; }

      .cluster { fill: rgba(15, 23, 42, 0.18); stroke-width: 1.5; stroke-dasharray: 9 7; }
      .cluster-left { stroke: #34d399; }
      .cluster-right { stroke: #a78bfa; }
      .cluster-title { font-size: 13px; font-weight: 900; letter-spacing: 0.7px; }
      .cluster-title.left { fill: #6ee7b7; }
      .cluster-title.right { fill: #c4b5fd; }

      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 14px; font-weight: 800; }
      .legend-text { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <text class="eyebrow" x="92" y="92">[PROJECT_NAME]</text>
  <text class="title" x="92" y="138">[DIAGRAM_TITLE]</text>
  <text class="subtitle" x="92" y="168">[DIAGRAM_DESCRIPTION]</text>

  <!-- Draw branches before topic cards so connectors stay behind the labels. -->
  <path class="branch" d="M 800 450 C 665 320, 515 290, 365 300" marker-end="url(#arrow)"/>
  <path class="branch" d="M 800 450 C 650 430, 515 430, 380 430" marker-end="url(#arrow)"/>
  <path class="branch branch-security" d="M 800 450 C 665 585, 515 620, 365 610" marker-end="url(#arrow-secondary)"/>
  <path class="branch" d="M 800 450 C 935 320, 1085 290, 1235 300" marker-end="url(#arrow)"/>
  <path class="branch branch-event" d="M 800 450 C 950 430, 1085 430, 1220 430" marker-end="url(#arrow)"/>
  <path class="branch branch-secondary" d="M 800 450 C 935 585, 1085 620, 1235 610" marker-end="url(#arrow-secondary)"/>

  <g data-cluster="left-capabilities">
    <rect class="cluster cluster-left" x="128" y="238" width="420" height="430" rx="20"/>
    <text class="cluster-title left" x="156" y="270">[CAPABILITY_GROUP_A]</text>
  </g>

  <g data-cluster="right-capabilities">
    <rect class="cluster cluster-right" x="1052" y="238" width="420" height="430" rx="20"/>
    <text class="cluster-title right" x="1080" y="270">[CAPABILITY_GROUP_B]</text>
  </g>

  <g data-topic="root">
    <rect class="topic-mask" x="660" y="390" width="280" height="120" rx="18"/>
    <rect class="topic topic-root" x="660" y="390" width="280" height="120" rx="18"/>
    <text class="topic-title" x="800" y="438" text-anchor="middle">[Central Topic]</text>
    <text class="topic-meta" x="800" y="466" text-anchor="middle">domain / capability</text>
    <text class="topic-meta" x="800" y="488" text-anchor="middle">Replace me</text>
  </g>

  <g data-topic="service">
    <rect class="topic-mask" x="215" y="260" width="230" height="76" rx="14"/>
    <rect class="topic topic-service" x="215" y="260" width="230" height="76" rx="14"/>
    <text class="topic-title" x="330" y="292" text-anchor="middle">[Service Topic]</text>
    <text class="topic-meta" x="330" y="315" text-anchor="middle">owned behavior</text>
  </g>

  <g data-topic="data">
    <rect class="topic-mask" x="215" y="392" width="230" height="76" rx="14"/>
    <rect class="topic topic-data" x="215" y="392" width="230" height="76" rx="14"/>
    <text class="topic-title" x="330" y="424" text-anchor="middle">[Data Topic]</text>
    <text class="topic-meta" x="330" y="447" text-anchor="middle">owned store</text>
  </g>

  <g data-topic="security">
    <rect class="topic-mask" x="215" y="572" width="230" height="76" rx="14"/>
    <rect class="topic topic-security" x="215" y="572" width="230" height="76" rx="14"/>
    <text class="topic-title" x="330" y="604" text-anchor="middle">[Policy Topic]</text>
    <text class="topic-meta" x="330" y="627" text-anchor="middle">control / rule</text>
  </g>

  <g data-topic="external">
    <rect class="topic-mask" x="1155" y="260" width="230" height="76" rx="14"/>
    <rect class="topic topic-external" x="1155" y="260" width="230" height="76" rx="14"/>
    <text class="topic-title" x="1270" y="292" text-anchor="middle">[External Topic]</text>
    <text class="topic-meta" x="1270" y="315" text-anchor="middle">outside boundary</text>
  </g>

  <g data-topic="event">
    <rect class="topic-mask" x="1155" y="392" width="230" height="76" rx="14"/>
    <rect class="topic topic-event" x="1155" y="392" width="230" height="76" rx="14"/>
    <text class="topic-title" x="1270" y="424" text-anchor="middle">[Event Topic]</text>
    <text class="topic-meta" x="1270" y="447" text-anchor="middle">message / signal</text>
  </g>

  <g data-topic="generic">
    <rect class="topic-mask" x="1155" y="572" width="230" height="76" rx="14"/>
    <rect class="topic topic-root" x="1155" y="572" width="230" height="76" rx="14"/>
    <text class="topic-title" x="1270" y="604" text-anchor="middle">[Outcome Topic]</text>
    <text class="topic-meta" x="1270" y="627" text-anchor="middle">result / impact</text>
  </g>

  <g class="legend" transform="translate(1040 704)">
    <rect class="legend-panel" x="0" y="0" width="420" height="112" rx="14"/>
    <text class="legend-title" x="24" y="32">Legend</text>
    <rect class="topic topic-service" x="24" y="52" width="22" height="14" rx="4"/>
    <text class="legend-text" x="58" y="64">Capability</text>
    <rect class="topic topic-data" x="230" y="52" width="22" height="14" rx="4"/>
    <text class="legend-text" x="264" y="64">Data topic</text>
    <line class="branch branch-secondary" x1="24" y1="88" x2="66" y2="88" marker-end="url(#arrow-secondary)"/>
    <text class="legend-text" x="82" y="92">Secondary branch</text>
  </g>

  <text class="footer" x="92" y="812">Generated by devspec - [DATE_OR_VERSION]</text>
</svg>
