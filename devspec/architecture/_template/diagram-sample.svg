<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Customer request routing - Process Flow Sample</title>
  <desc id="desc">A confirmed request is routed to a localized quickfix or to a traceable work item based on scope and risk, and either route ends in one durable record.</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; font-weight: 500; }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .footer { fill: #64748b; font-size: 12px; }

      .lane { fill: rgba(15, 23, 42, 0.22); stroke: #334155; stroke-width: 1.2; stroke-dasharray: 8 8; }
      .lane-title { fill: #6ee7b7; font-size: 13px; font-weight: 900; letter-spacing: 1.2px; }

      .step-mask { fill: #0f172a; }
      .step { stroke-width: 1.8; filter: url(#node-glow); }
      .step-boundary { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .step-integration { fill: rgba(120, 53, 15, 0.40); stroke: #fbbf24; }
      .step-automated { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .step-review { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .decision { fill: rgba(136, 19, 55, 0.46); stroke: #fb7185; stroke-width: 2; }

      .step-title { fill: #f8fafc; font-size: 16px; font-weight: 800; }
      .step-detail { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
      .decision-text { fill: #f8fafc; font-size: 15px; font-weight: 800; }

      .flow { fill: none; stroke: #e2e8f0; stroke-width: 2.4; }
      .flow-alt { stroke: #fbbf24; }
      .flow-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .flow-label { fill: #f8fafc; font-size: 12px; font-weight: 800; }

      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 14px; font-weight: 800; }
      .legend-text { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <text class="eyebrow" x="92" y="92">DEVSPEC / PROCESS FLOW SAMPLE</text>
  <text class="title" x="92" y="138">Customer request routing</text>
  <text class="subtitle" x="92" y="168">Use confirmed scope and risk to select one durable route.</text>

  <rect class="lane" x="92" y="250" width="1416" height="380" rx="16"/>
  <text class="lane-title" x="118" y="284">CONFIRMED ROUTE</text>

  <!-- Connectors are drawn before the cards, so every arrowhead lands on a card edge and no label sits on a corner. -->
  <path class="flow" d="M 370 422 H 475" marker-end="url(#arrow)"/>

  <path class="flow flow-alt" d="M 645 422 H 706 V 354 H 790" marker-end="url(#arrow-alt)"/>
  <rect class="flow-label-bg" x="716" y="342" width="56" height="24" rx="7"/>
  <text class="flow-label" x="744" y="359" text-anchor="middle">YES</text>

  <path class="flow" d="M 560 497 V 518 H 790" marker-end="url(#arrow)"/>
  <rect class="flow-label-bg" x="612" y="506" width="104" height="24" rx="7"/>
  <text class="flow-label" x="664" y="523" text-anchor="middle">NO / RISK</text>

  <path class="flow flow-alt" d="M 1040 354 H 1130 V 422 H 1200" marker-end="url(#arrow-alt)"/>
  <path class="flow" d="M 1040 518 H 1130 V 422 H 1200" marker-end="url(#arrow)"/>

  <g data-step="request">
    <rect class="step-mask" x="140" y="376" width="230" height="92" rx="14"/>
    <rect class="step step-boundary" x="140" y="376" width="230" height="92" rx="14"/>
    <text class="step-title" x="255" y="412" text-anchor="middle">Request</text>
    <text class="step-detail" x="255" y="437" text-anchor="middle">confirmed need</text>
  </g>

  <g data-step="decision">
    <polygon class="step-mask" points="560,347 645,422 560,497 475,422"/>
    <polygon class="decision" points="560,347 645,422 560,497 475,422"/>
    <text class="decision-text" x="560" y="416" text-anchor="middle">Local +</text>
    <text class="decision-text" x="560" y="438" text-anchor="middle">low risk?</text>
  </g>

  <g data-step="quickfix">
    <rect class="step-mask" x="790" y="306" width="250" height="96" rx="14"/>
    <rect class="step step-integration" x="790" y="306" width="250" height="96" rx="14"/>
    <text class="step-title" x="915" y="344" text-anchor="middle">quickfix</text>
    <text class="step-detail" x="915" y="369" text-anchor="middle">focused validation</text>
  </g>

  <g data-step="work-item">
    <rect class="step-mask" x="790" y="470" width="250" height="96" rx="14"/>
    <rect class="step step-automated" x="790" y="470" width="250" height="96" rx="14"/>
    <text class="step-title" x="915" y="508" text-anchor="middle">work item</text>
    <text class="step-detail" x="915" y="533" text-anchor="middle">story to review</text>
  </g>

  <g data-step="record">
    <rect class="step-mask" x="1200" y="376" width="250" height="92" rx="14"/>
    <rect class="step step-review" x="1200" y="376" width="250" height="92" rx="14"/>
    <text class="step-title" x="1325" y="412" text-anchor="middle">Record</text>
    <text class="step-detail" x="1325" y="437" text-anchor="middle">evidence + next</text>
  </g>

  <g class="legend" transform="translate(92 676)">
    <rect class="legend-panel" x="0" y="0" width="900" height="76" rx="14"/>
    <text class="legend-title" x="24" y="48">Legend</text>
    <rect class="step step-boundary" x="130" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="164" y="52">Entry</text>
    <polygon class="decision" points="290,40 304,54 290,68 276,54"/>
    <text class="legend-text" x="318" y="58">Decision</text>
    <rect class="step step-integration" x="450" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="484" y="52">Quickfix route</text>
    <rect class="step step-automated" x="640" y="40" width="22" height="14" rx="4"/>
    <text class="legend-text" x="674" y="52">Work-item route</text>
  </g>

  <text class="footer" x="92" y="812">EVIDENCE: QUICKFIX + STORY CONTRACTS - TYPE: PROCESS FLOW - STATUS: COMPLETE</text>
</svg>
