<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">[DIAGRAM_TITLE]</title>
  <desc id="desc">[DIAGRAM_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; font-weight: 500; }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .footer { fill: #64748b; font-size: 12px; }

      .boundary { fill: rgba(15, 23, 42, 0.20); stroke-width: 1.7; stroke-dasharray: 10 7; }
      .boundary-client { stroke: #22d3ee; }
      .boundary-app { stroke: #34d399; }
      .boundary-external { stroke: #fbbf24; }
      .boundary-security { stroke: #fb7185; stroke-dasharray: 6 6; }
      .boundary-title { font-size: 14px; font-weight: 800; letter-spacing: 0.7px; }
      .boundary-title.client { fill: #67e8f9; }
      .boundary-title.app { fill: #6ee7b7; }
      .boundary-title.external { fill: #fcd34d; }
      .boundary-title.security { fill: #fda4af; }

      .node-mask { fill: #0f172a; }
      .node { stroke-width: 1.8; filter: url(#node-glow); }
      .node-frontend { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .node-backend { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .node-data { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .node-external { fill: rgba(120, 53, 15, 0.40); stroke: #fbbf24; }
      .node-security { fill: rgba(136, 19, 55, 0.46); stroke: #fb7185; }
      .node-event { fill: rgba(124, 45, 18, 0.42); stroke: #fb923c; }
      .node-generic { fill: rgba(30, 41, 59, 0.66); stroke: #94a3b8; }

      .node-title { fill: #f8fafc; font-size: 16px; font-weight: 800; }
      .node-meta { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
      .node-tag { fill: #94a3b8; font-size: 11px; font-weight: 600; }

      .flow { fill: none; stroke: #e2e8f0; stroke-width: 2.2; opacity: 0.92; }
      .flow-secondary { stroke: #94a3b8; stroke-dasharray: 7 5; }
      .flow-security { stroke: #fb7185; stroke-dasharray: 7 6; }
      .flow-event { stroke: #fb923c; stroke-dasharray: 9 5; }
      .flow-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .flow-label { fill: #f8fafc; font-size: 12px; font-weight: 800; }
      .step-badge { fill: #2563eb; stroke: #93c5fd; stroke-width: 1.4; }
      .step-text { fill: #eff6ff; font-size: 13px; font-weight: 900; }

      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 14px; font-weight: 800; }
      .legend-text { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>

    <marker id="arrow-security" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>

    <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <text class="eyebrow" x="92" y="92">[PROJECT_NAME]</text>
  <text class="title" x="92" y="138">[DIAGRAM_TITLE]</text>
  <text class="subtitle" x="92" y="168">[DIAGRAM_DESCRIPTION]</text>

  <!-- Draw arrows before boundaries and nodes so connectors stay behind component boxes. -->
  <path class="flow flow-security" d="M 250 330 C 345 255, 455 255, 550 330" marker-end="url(#arrow-security)"/>
  <g transform="translate(387 248)">
    <circle class="step-badge" cx="0" cy="0" r="16"/>
    <text class="step-text" x="0" y="5" text-anchor="middle">1</text>
  </g>
  <rect class="flow-label-bg" x="410" y="236" width="78" height="24" rx="7"/>
  <text class="flow-label" x="449" y="253" text-anchor="middle">Sign in</text>

  <path class="flow" d="M 250 420 C 340 420, 460 420, 550 420" marker-end="url(#arrow)"/>
  <g transform="translate(385 420)">
    <circle class="step-badge" cx="0" cy="0" r="16"/>
    <text class="step-text" x="0" y="5" text-anchor="middle">2</text>
  </g>
  <rect class="flow-label-bg" x="410" y="408" width="78" height="24" rx="7"/>
  <text class="flow-label" x="449" y="425" text-anchor="middle">Request</text>

  <path class="flow" d="M 750 420 C 835 420, 925 420, 1010 420" marker-end="url(#arrow)"/>
  <g transform="translate(872 420)">
    <circle class="step-badge" cx="0" cy="0" r="16"/>
    <text class="step-text" x="0" y="5" text-anchor="middle">3</text>
  </g>
  <rect class="flow-label-bg" x="898" y="408" width="76" height="24" rx="7"/>
  <text class="flow-label" x="936" y="425" text-anchor="middle">Calls</text>

  <path class="flow flow-secondary" d="M 650 488 C 650 548, 650 575, 650 635" marker-end="url(#arrow-secondary)"/>
  <g transform="translate(650 556)">
    <circle class="step-badge" cx="0" cy="0" r="16"/>
    <text class="step-text" x="0" y="5" text-anchor="middle">4</text>
  </g>
  <rect class="flow-label-bg" x="672" y="544" width="86" height="24" rx="7"/>
  <text class="flow-label" x="715" y="561" text-anchor="middle">Stores</text>

  <path class="flow flow-event" d="M 750 470 C 850 585, 990 585, 1090 470" marker-end="url(#arrow-event)"/>
  <g transform="translate(916 586)">
    <circle class="step-badge" cx="0" cy="0" r="16"/>
    <text class="step-text" x="0" y="5" text-anchor="middle">5</text>
  </g>
  <rect class="flow-label-bg" x="942" y="574" width="86" height="24" rx="7"/>
  <text class="flow-label" x="985" y="591" text-anchor="middle">Events</text>

  <g class="boundary-group" data-boundary="client-boundary">
    <rect class="boundary boundary-client" x="104" y="250" width="210" height="260" rx="18"/>
    <text class="boundary-title client" x="130" y="282">[CLIENT_BOUNDARY]</text>
  </g>

  <g class="boundary-group" data-boundary="application-boundary">
    <rect class="boundary boundary-app" x="500" y="245" width="640" height="500" rx="20"/>
    <text class="boundary-title app" x="528" y="278">[APPLICATION_BOUNDARY]</text>
  </g>

  <g class="boundary-group" data-boundary="external-boundary">
    <rect class="boundary boundary-external" x="1200" y="250" width="265" height="260" rx="18"/>
    <text class="boundary-title external" x="1228" y="282">[EXTERNAL_BOUNDARY]</text>
  </g>

  <g class="boundary-group" data-boundary="security-boundary">
    <rect class="boundary boundary-security" x="520" y="304" width="250" height="206" rx="16"/>
    <text class="boundary-title security" x="546" y="334">[SECURITY_BOUNDARY]</text>
  </g>

  <g class="component" data-component="user-client">
    <rect class="node-mask" x="142" y="338" width="172" height="92" rx="12"/>
    <rect class="node node-frontend" x="142" y="338" width="172" height="92" rx="12"/>
    <text class="node-title" x="228" y="373" text-anchor="middle">User Client</text>
    <text class="node-meta" x="228" y="398" text-anchor="middle">Actor Entry</text>
    <text class="node-tag" x="228" y="420" text-anchor="middle">Replace me</text>
  </g>

  <g class="component" data-component="security-control">
    <rect class="node-mask" x="550" y="350" width="200" height="86" rx="12"/>
    <rect class="node node-security" x="550" y="350" width="200" height="86" rx="12"/>
    <text class="node-title" x="650" y="383" text-anchor="middle">Security</text>
    <text class="node-meta" x="650" y="406" text-anchor="middle">Policy Checks</text>
    <text class="node-tag" x="650" y="427" text-anchor="middle">Replace me</text>
  </g>

  <g class="component" data-component="orchestration-service">
    <rect class="node-mask" x="800" y="350" width="210" height="86" rx="12"/>
    <rect class="node node-backend" x="800" y="350" width="210" height="86" rx="12"/>
    <text class="node-title" x="905" y="383" text-anchor="middle">Core Service</text>
    <text class="node-meta" x="905" y="406" text-anchor="middle">Orchestration</text>
    <text class="node-tag" x="905" y="427" text-anchor="middle">Replace me</text>
  </g>

  <g class="component" data-component="data-store">
    <rect class="node-mask" x="550" y="635" width="200" height="86" rx="12"/>
    <rect class="node node-data" x="550" y="635" width="200" height="86" rx="12"/>
    <text class="node-title" x="650" y="668" text-anchor="middle">Data Store</text>
    <text class="node-meta" x="650" y="691" text-anchor="middle">Owned Data</text>
    <text class="node-tag" x="650" y="712" text-anchor="middle">Replace me</text>
  </g>

  <g class="component" data-component="worker">
    <rect class="node-mask" x="850" y="635" width="200" height="86" rx="12"/>
    <rect class="node node-event" x="850" y="635" width="200" height="86" rx="12"/>
    <text class="node-title" x="950" y="668" text-anchor="middle">Worker</text>
    <text class="node-meta" x="950" y="691" text-anchor="middle">Async Flow</text>
    <text class="node-tag" x="950" y="712" text-anchor="middle">Replace me</text>
  </g>

  <g class="component" data-component="external-system">
    <rect class="node-mask" x="1235" y="344" width="200" height="92" rx="12"/>
    <rect class="node node-external" x="1235" y="344" width="200" height="92" rx="12"/>
    <text class="node-title" x="1335" y="379" text-anchor="middle">External API</text>
    <text class="node-meta" x="1335" y="404" text-anchor="middle">Third Party</text>
    <text class="node-tag" x="1335" y="426" text-anchor="middle">Replace me</text>
  </g>

  <g class="legend" transform="translate(1040 690)">
    <rect class="legend-panel" x="0" y="0" width="420" height="112" rx="14"/>
    <text class="legend-title" x="24" y="32">Legend</text>
    <circle class="step-badge" cx="34" cy="62" r="12"/>
    <text class="step-text" x="34" y="67" text-anchor="middle">1</text>
    <text class="legend-text" x="58" y="67">Numbered data or control flow</text>
    <rect class="node node-backend" x="250" y="52" width="22" height="14" rx="4"/>
    <text class="legend-text" x="284" y="64">Owned service</text>
    <line class="flow flow-secondary" x1="24" y1="88" x2="66" y2="88" marker-end="url(#arrow-secondary)"/>
    <text class="legend-text" x="82" y="92">Optional or async flow</text>
    <rect class="boundary boundary-security" x="250" y="80" width="22" height="14" rx="3"/>
    <text class="legend-text" x="284" y="92">Boundary</text>
  </g>

  <text class="footer" x="92" y="812">Generated by devspec - [DATE_OR_VERSION]</text>
</svg>
