<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">[DIAGRAM_TITLE] - State Lifecycle Diagram</title>
  <desc id="desc">[DIAGRAM_DESCRIPTION]</desc>

  <defs>
    <style><![CDATA[
      svg {
        background: #020617;
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }

      .page-bg { fill: #020617; }
      .grid-line { stroke: #1e293b; stroke-width: 0.7; opacity: 0.65; }
      .surface { fill: #0f172a; stroke: #1e293b; stroke-width: 1.4; filter: url(#soft-shadow); }
      .title { fill: #f8fafc; font-size: 38px; font-weight: 800; }
      .subtitle { fill: #cbd5e1; font-size: 16px; font-weight: 500; }
      .eyebrow { fill: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .footer { fill: #64748b; font-size: 12px; }

      .region { fill: rgba(15, 23, 42, 0.20); stroke-width: 1.7; stroke-dasharray: 10 7; }
      .region-main { stroke: #34d399; }
      .region-exception { stroke: #fb7185; stroke-dasharray: 6 6; }
      .region-title { font-size: 14px; font-weight: 800; letter-spacing: 0.7px; }
      .region-title.main { fill: #6ee7b7; }
      .region-title.exception { fill: #fda4af; }

      .state-mask { fill: #0f172a; }
      .state { stroke-width: 1.8; filter: url(#node-glow); }
      .state-start { fill: rgba(8, 51, 68, 0.46); stroke: #22d3ee; }
      .state-active { fill: rgba(6, 78, 59, 0.46); stroke: #34d399; }
      .state-review { fill: rgba(76, 29, 149, 0.46); stroke: #a78bfa; }
      .state-final { fill: rgba(30, 41, 59, 0.66); stroke: #94a3b8; }
      .state-exception { fill: rgba(136, 19, 55, 0.46); stroke: #fb7185; }
      .state-title { fill: #f8fafc; font-size: 16px; font-weight: 800; }
      .state-meta { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
      .terminal { fill: #020617; stroke: #e2e8f0; stroke-width: 2; filter: url(#node-glow); }
      .terminal-inner { fill: #e2e8f0; }

      .transition { fill: none; stroke: #e2e8f0; stroke-width: 2.2; opacity: 0.92; }
      .transition-secondary { fill: none; stroke: #94a3b8; stroke-width: 2.2; opacity: 0.92; stroke-dasharray: 7 5; }
      .transition-exception { fill: none; stroke: #fb7185; stroke-width: 2.2; opacity: 0.92; stroke-dasharray: 7 6; }
      .transition-loop { fill: none; stroke: #22d3ee; stroke-width: 2.2; opacity: 0.92; stroke-dasharray: 9 5; }
      .transition-label-bg { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .transition-label { fill: #f8fafc; font-size: 12px; font-weight: 800; }

      .legend-panel { fill: rgba(15, 23, 42, 0.86); stroke: #334155; stroke-width: 1.2; }
      .legend-title { fill: #f8fafc; font-size: 14px; font-weight: 800; }
      .legend-text { fill: #cbd5e1; font-size: 12px; font-weight: 600; }
    ]]></style>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M 48 0 L 0 0 0 48" fill="none"/>
    </pattern>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>

    <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.16"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0"/>
    </marker>

    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>

    <marker id="arrow-security" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>

    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect class="page-bg" width="1600" height="900"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.42"/>
  <rect class="surface" x="48" y="42" width="1504" height="816" rx="20"/>

  <text class="eyebrow" x="92" y="92">[PROJECT_NAME]</text>
  <text class="title" x="92" y="138">[DIAGRAM_TITLE]</text>
  <text class="subtitle" x="92" y="168">[DIAGRAM_DESCRIPTION]</text>

  <g data-region="main-lifecycle">
    <rect class="region region-main" x="104" y="250" width="1300" height="300" rx="20"/>
    <text class="region-title main" x="132" y="282">[PRIMARY_LIFECYCLE]</text>
  </g>

  <g data-region="exception-lifecycle">
    <rect class="region region-exception" x="735" y="610" width="280" height="130" rx="18"/>
    <text class="region-title exception" x="762" y="640">[EXCEPTION_STATE]</text>
  </g>

  <!-- Draw transitions after regions and before state nodes so connectors stay readable but behind lifecycle boxes. -->
  <path class="transition" d="M 194 420 C 265 420, 315 420, 386 420" marker-end="url(#arrow)"/>
  <rect class="transition-label-bg" x="260" y="408" width="74" height="24" rx="7"/>
  <text class="transition-label" x="297" y="425" text-anchor="middle">Create</text>

  <path class="transition" d="M 586 420 C 655 420, 705 420, 774 420" marker-end="url(#arrow)"/>
  <rect class="transition-label-bg" x="650" y="408" width="86" height="24" rx="7"/>
  <text class="transition-label" x="693" y="425" text-anchor="middle">Submit</text>

  <path class="transition" d="M 974 420 C 1043 420, 1093 420, 1162 420" marker-end="url(#arrow)"/>
  <rect class="transition-label-bg" x="1036" y="408" width="88" height="24" rx="7"/>
  <text class="transition-label" x="1080" y="425" text-anchor="middle">Approve</text>

  <path class="transition transition-secondary" d="M 1362 420 C 1410 420, 1430 420, 1478 420" marker-end="url(#arrow-secondary)"/>
  <path class="transition transition-exception" d="M 874 470 C 874 545, 874 570, 874 645" marker-end="url(#arrow-security)"/>
  <rect class="transition-label-bg" x="900" y="546" width="88" height="24" rx="7"/>
  <text class="transition-label" x="944" y="563" text-anchor="middle">Reject</text>

  <path class="transition transition-loop" d="M 774 688 C 635 745, 455 720, 486 488" marker-end="url(#arrow-loop)"/>
  <rect class="transition-label-bg" x="565" y="708" width="96" height="24" rx="7"/>
  <text class="transition-label" x="613" y="725" text-anchor="middle">Revise</text>

  <g data-state="start">
    <circle class="terminal" cx="154" cy="420" r="40"/>
    <circle class="terminal-inner" cx="154" cy="420" r="18"/>
  </g>

  <g data-state="draft">
    <rect class="state-mask" x="386" y="366" width="200" height="108" rx="14"/>
    <rect class="state state-start" x="386" y="366" width="200" height="108" rx="14"/>
    <text class="state-title" x="486" y="405" text-anchor="middle">Draft</text>
    <text class="state-meta" x="486" y="430" text-anchor="middle">Initial state</text>
    <text class="state-meta" x="486" y="452" text-anchor="middle">Editable</text>
  </g>

  <g data-state="review">
    <rect class="state-mask" x="774" y="366" width="200" height="108" rx="14"/>
    <rect class="state state-review" x="774" y="366" width="200" height="108" rx="14"/>
    <text class="state-title" x="874" y="405" text-anchor="middle">In Review</text>
    <text class="state-meta" x="874" y="430" text-anchor="middle">Quality gate</text>
    <text class="state-meta" x="874" y="452" text-anchor="middle">Decision point</text>
  </g>

  <g data-state="approved">
    <rect class="state-mask" x="1162" y="366" width="200" height="108" rx="14"/>
    <rect class="state state-active" x="1162" y="366" width="200" height="108" rx="14"/>
    <text class="state-title" x="1262" y="405" text-anchor="middle">Approved</text>
    <text class="state-meta" x="1262" y="430" text-anchor="middle">Ready state</text>
    <text class="state-meta" x="1262" y="452" text-anchor="middle">Locked</text>
  </g>

  <g data-state="end">
    <circle class="terminal" cx="1498" cy="420" r="32"/>
    <circle class="terminal-inner" cx="1498" cy="420" r="18"/>
  </g>

  <g data-state="rework">
    <rect class="state-mask" x="774" y="652" width="200" height="66" rx="14"/>
    <rect class="state state-exception" x="774" y="652" width="200" height="66" rx="14"/>
    <text class="state-title" x="874" y="681" text-anchor="middle">Rework</text>
    <text class="state-meta" x="874" y="704" text-anchor="middle">Resolve issues</text>
  </g>

  <g class="legend" transform="translate(1040 690)">
    <rect class="legend-panel" x="0" y="0" width="420" height="112" rx="14"/>
    <text class="legend-title" x="24" y="32">Legend</text>
    <rect class="state state-active" x="24" y="52" width="22" height="14" rx="4"/>
    <text class="legend-text" x="58" y="64">Normal state</text>
    <rect class="state state-exception" x="230" y="52" width="22" height="14" rx="4"/>
    <text class="legend-text" x="264" y="64">Exception</text>
    <line class="transition transition-secondary" x1="24" y1="88" x2="66" y2="88" marker-end="url(#arrow-secondary)"/>
    <text class="legend-text" x="82" y="92">Return or terminal flow</text>
    <line class="transition transition-exception" x1="230" y1="88" x2="272" y2="88" marker-end="url(#arrow-security)"/>
    <text class="legend-text" x="288" y="92">Rejected transition</text>
  </g>

  <text class="footer" x="92" y="812">Generated by devspec - [DATE_OR_VERSION]</text>
</svg>
