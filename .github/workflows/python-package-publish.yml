name: Python Package Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "none builds artifacts only; testpypi also uploads them to TestPyPI. PyPI is published only from a v* tag."
        required: true
        default: "none"
        type: choice
        options:
          - "none"
          - "testpypi"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  python-package:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}"

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build Python wheel and sdist
        run: uv build

      - name: Smoke test Python package
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl | head -n 1)"
          temp_dir="$(mktemp -d)"
          uvx --from "$wheel" devspec --version
          uvx --from "$wheel" devspec init --target "$temp_dir" --profile all --repo-state existing
          uvx --from "$wheel" devspec doctor --target "$temp_dir" --profile all

      - name: Create package checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f ! -name devspec-python-package-checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/devspec-python-package-checksums.txt

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devspec-python-package-dist
          path: dist/*

      - name: Publish Python package to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'testpypi'
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*.tar.gz dist/*.whl

      - name: Publish Python package to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv publish dist/*.tar.gz dist/*.whl

      - name: Attach Python package release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
