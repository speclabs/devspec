name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: uv run pytest

      - name: Build Python package
        run: uv build

      - name: Build framework zip
        run: |
          mkdir -p dist/framework
          zip -r "dist/devspec-framework-${GITHUB_REF_NAME:-local}.zip" \
            AGENTS.md GEMINI.md README.md docs devspec .github .claude .cursor .gemini .agents packaging/devspec-profiles.json
          sha256sum dist/* > dist/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'false'
        run: uv publish --publish-url https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        run: uv publish

      - name: Attach GitHub release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
