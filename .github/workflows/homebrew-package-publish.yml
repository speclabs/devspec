name: Homebrew Package Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version without the leading v; empty uses the package version. The v<version> tag must already exist."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  homebrew-package:
    name: Generate Homebrew formula artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate Homebrew formula
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(python scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}")"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$(python scripts/verify_release_version.py --tag "v${INPUT_VERSION}")"
          else
            version="$(PYTHONPATH=src python -c 'from devspec import __version__; print(__version__)')"
          fi

          # The formula builds from the PyPI sdist because its checksum is stable, unlike
          # GitHub's on-the-fly tag archives. A tag push races the PyPI upload, so poll.
          sdist_meta=""
          for attempt in $(seq 1 20); do
            if sdist_meta="$(curl -fsSL "https://pypi.org/pypi/devspec/${version}/json" | python -c '
          import json, sys
          sdists = [entry for entry in json.load(sys.stdin)["urls"] if entry["packagetype"] == "sdist"]
          if not sdists:
              raise SystemExit(1)
          print(sdists[0]["url"])
          print(sdists[0]["digests"]["sha256"])
          ')"; then
              break
            fi
            sdist_meta=""
            echo "devspec ${version} sdist is not on PyPI yet (attempt ${attempt}/20); retrying in 30s"
            sleep 30
          done
          if [[ -z "${sdist_meta}" ]]; then
            echo "devspec ${version} sdist did not appear on PyPI" >&2
            exit 1
          fi
          sdist_url="$(head -n 1 <<<"${sdist_meta}")"
          sha256="$(tail -n 1 <<<"${sdist_meta}")"

          actual_sha256="$(curl -fsSL "${sdist_url}" | sha256sum | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${sha256}" ]]; then
            echo "PyPI digest ${sha256} does not match downloaded sdist digest ${actual_sha256}" >&2
            exit 1
          fi

          mkdir -p dist/homebrew/Formula
          sed -e "s|REPLACE_WITH_SDIST_URL|${sdist_url}|g" -e "s|REPLACE_WITH_RELEASE_SHA256|${sha256}|g" \
            packaging/homebrew/devspec.rb > dist/homebrew/Formula/devspec.rb
          if grep -q 'REPLACE_WITH_' dist/homebrew/Formula/devspec.rb; then
            echo "Unresolved placeholder in the generated formula" >&2
            exit 1
          fi
          ruby -c dist/homebrew/Formula/devspec.rb

          sdist_name="$(basename "${sdist_url}")"
          echo "${sha256}  ${sdist_name}" > "dist/homebrew/${sdist_name}.sha256"
          echo "Homebrew formula: dist/homebrew/Formula/devspec.rb"
          echo "PyPI sdist: ${sdist_url}"
          echo "PyPI sdist SHA256: ${sha256}"

      - name: Upload Homebrew package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devspec-homebrew-package
          path: |
            dist/homebrew/Formula/devspec.rb
            dist/homebrew/*.sha256
