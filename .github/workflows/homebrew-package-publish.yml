name: Homebrew Package Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version without the leading v; empty uses the package version. The v<version> tag must already exist."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  homebrew-package:
    name: Generate Homebrew formula artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate Homebrew formula
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="$(python scripts/verify_release_version.py --tag "${GITHUB_REF_NAME}")"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="$(python scripts/verify_release_version.py --tag "v${INPUT_VERSION}")"
          else
            version="$(PYTHONPATH=src python -c 'from devspec import __version__; print(__version__)')"
          fi

          tarball_url="https://github.com/speclabs/devspec/archive/refs/tags/v${version}.tar.gz"
          sha256="$(curl -fsSL "${tarball_url}" | sha256sum | awk '{print $1}')"

          mkdir -p dist/homebrew/Formula
          sed -e "s/REPLACE_WITH_VERSION/${version}/g" -e "s/REPLACE_WITH_RELEASE_SHA256/${sha256}/g" \
            packaging/homebrew/devspec.rb > dist/homebrew/Formula/devspec.rb
          if grep -q 'REPLACE_WITH_' dist/homebrew/Formula/devspec.rb; then
            echo "Unresolved placeholder in the generated formula" >&2
            exit 1
          fi
          ruby -c dist/homebrew/Formula/devspec.rb

          echo "${sha256}  devspec-v${version}.tar.gz" > "dist/homebrew/devspec-v${version}.tar.gz.sha256"
          echo "Homebrew formula: dist/homebrew/Formula/devspec.rb"
          echo "Source tarball SHA256: ${sha256}"

      - name: Upload Homebrew package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devspec-homebrew-package
          path: |
            dist/homebrew/Formula/devspec.rb
            dist/homebrew/*.sha256
