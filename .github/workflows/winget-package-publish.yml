name: WinGet Package Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  winget-package:
    name: Build WinGet portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: python scripts/verify_release_version.py --tag $env:GITHUB_REF_NAME

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Build Python wheel
        run: uv build --wheel

      - name: Build devspec.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = Get-ChildItem dist -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) {
            throw "No wheel found in dist."
          }

          uv venv .venv-winget --python 3.12 --clear
          uv pip install --python .\.venv-winget\Scripts\python.exe "pyinstaller>=6.22.2" $wheel.FullName

          New-Item -ItemType Directory -Force -Path build\winget | Out-Null
          @(
            "from devspec.cli import main"
            ""
            "raise SystemExit(main())"
          ) | Set-Content -Path build\winget\devspec-entry.py -Encoding UTF8

          .\.venv-winget\Scripts\pyinstaller.exe `
            --noconfirm `
            --clean `
            --onefile `
            --name devspec `
            --distpath dist\winget `
            --workpath build\pyinstaller `
            --specpath build\pyinstaller `
            --collect-data devspec `
            build\winget\devspec-entry.py

      - name: Smoke test devspec.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $target = Join-Path $env:RUNNER_TEMP "devspec-winget-smoke"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          .\dist\winget\devspec.exe --version
          .\dist\winget\devspec.exe init --target $target --profile all --repo-state existing
          .\dist\winget\devspec.exe doctor --target $target --profile all

      - name: Generate WinGet manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # The executable reports the version it was built from; tag runs verified it above.
          $version = (.\dist\winget\devspec.exe --version).Split(" ")[-1]
          $hash = (Get-FileHash dist\winget\devspec.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  devspec.exe" | Set-Content -Path dist\winget\devspec.exe.sha256 -Encoding ASCII

          $url = "https://github.com/speclabs/devspec/releases/download/v$version/devspec.exe"
          $manifestRoot = "dist\winget\manifests\s\SpecLabs\Devspec\$version"
          New-Item -ItemType Directory -Force -Path $manifestRoot | Out-Null
          Get-ChildItem packaging\winget -Filter "SpecLabs.Devspec*.yaml" | ForEach-Object {
            $manifest = (Get-Content $_.FullName -Raw).Replace("REPLACE_WITH_VERSION", $version).Replace("REPLACE_WITH_RELEASE_URL", $url).Replace("REPLACE_WITH_RELEASE_SHA256", $hash)
            if ($manifest.Contains("REPLACE_WITH_")) {
              throw "Unresolved placeholder in $($_.Name)"
            }
            Set-Content -Path (Join-Path $manifestRoot $_.Name) -Value $manifest -Encoding UTF8 -NoNewline
          }

          Write-Host "devspec.exe SHA256: $hash"
          Write-Host "WinGet manifests: $manifestRoot"

      - name: Upload WinGet package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: devspec-winget-package
          path: |
            dist/winget/devspec.exe
            dist/winget/devspec.exe.sha256
            dist/winget/manifests/**/*.yaml

      - name: Attach WinGet package artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/winget/devspec.exe
            dist/winget/devspec.exe.sha256
            dist/winget/manifests/**/*.yaml
